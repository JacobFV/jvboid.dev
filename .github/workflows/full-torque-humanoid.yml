name: full-torque humanoid self-model study

on:
  push:
    branches:
      - agent/full-torque-humanoid-self-model
    paths:
      - "experiments/full_torque_humanoid/**"
      - ".github/workflows/full-torque-humanoid.yml"
  pull_request:
    branches:
      - main
    paths:
      - "experiments/full_torque_humanoid/**"
      - ".github/workflows/full-torque-humanoid.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: full-torque-humanoid-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore exact study source
        shell: bash
        run: |
          set -euo pipefail
          echo "259a32900d130b67197ead6cfdaabe08c95d4e3701385bccb6de8b5ae4bad330  experiments/full_torque_humanoid/archive.00.b64" | sha256sum --check --strict
          echo "9f1a2399695da29043801d5c7fe132e843212a5a252d7a1b9f0e1e8782d6d89e  experiments/full_torque_humanoid/archive.01.b64" | sha256sum --check --strict
          echo "ac7f81bd717cc88fe2fb69b1960f883a22b62844d334b337734ad48024c41584  experiments/full_torque_humanoid/archive.02.b64" | sha256sum --check --strict
          echo "bd1948be52694d97354189b556d8b17e2a08cd2c8a50ea0eba259571e1dcce4c  experiments/full_torque_humanoid/archive.03.b64" | sha256sum --check --strict
          echo "72633965aa7af75a9554d427e3739e08a686172505f110f8cc32d6aa4d4feb58  experiments/full_torque_humanoid/archive.04.b64" | sha256sum --check --strict
          echo "80c14aa67d9b166436c28214c16fb541785d9947a8436a231432a6b1d9c274e3  experiments/full_torque_humanoid/archive.05.b64" | sha256sum --check --strict
          cat experiments/full_torque_humanoid/archive.*.b64 > /tmp/full_control_study.py.gz.b64
          echo "42d6eaa1e4d0162deebcf9844d4de54ec8929c9fbe9e2d2f215d29f1cc0cc228  /tmp/full_control_study.py.gz.b64" | sha256sum --check --strict
          base64 --decode /tmp/full_control_study.py.gz.b64 > /tmp/full_control_study.py.gz
          echo "332937f291e3971241baff72285d832753e6b480516c77f778979e9418c81607  /tmp/full_control_study.py.gz" | sha256sum --check --strict
          gzip --test /tmp/full_control_study.py.gz
          gzip --decompress --stdout /tmp/full_control_study.py.gz > experiments/full_torque_humanoid/full_control_study.py
          echo "d35e874b14f2831423cbfab2f88d0428313e522cff5dd3e7914f4bf7bab3b549  experiments/full_torque_humanoid/full_control_study.py" | sha256sum --check --strict
          python -m py_compile experiments/full_torque_humanoid/full_control_study.py

      - name: Install rigid-body simulation and learning runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libosmesa6-dev libgl1 ffmpeg
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "mujoco>=3.2,<4" numpy scipy pandas pillow imageio imageio-ffmpeg matplotlib

      - name: Synthesize and validate whole-body torque feedback
        id: lqr
        shell: bash
        run: |
          set +e
          python experiments/full_torque_humanoid/diagnose_lqr.py 2>&1 | tee /tmp/lqr-last-run.log
          code=${PIPESTATUS[0]}
          echo "$code" > /tmp/lqr-last-run.exit
          exit "$code"

      - name: Diagnose the original controller for comparison
        if: failure()
        shell: bash
        run: |
          set +e
          python experiments/full_torque_humanoid/diagnose_expert.py 2>&1 | tee /tmp/original-controller-last-run.log
          exit 0

      - name: Publish concise controller diagnostics
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p experiments/full_torque_humanoid/diagnostics
          if [ -f /tmp/lqr-last-run.log ]; then
            tail -n 400 /tmp/lqr-last-run.log > experiments/full_torque_humanoid/diagnostics/lqr-last-run.log
          fi
          if [ -f /tmp/lqr-last-run.exit ]; then
            cp /tmp/lqr-last-run.exit experiments/full_torque_humanoid/diagnostics/lqr-last-run.exit
          fi
          if [ -f /tmp/original-controller-last-run.log ]; then
            tail -n 300 /tmp/original-controller-last-run.log > experiments/full_torque_humanoid/diagnostics/original-controller-last-run.log
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/full_torque_humanoid/diagnostics
          if ! git diff --cached --quiet; then
            git commit -m "publish full-torque controller diagnostics"
            git push origin HEAD:agent/full-torque-humanoid-self-model
          fi

      - name: Validate the physical morphology and expert demonstrations
        shell: bash
        run: |
          set -euo pipefail
          python experiments/full_torque_humanoid/full_control_study.py --smoke-only

      - name: Train, evaluate, and render every policy
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/full_torque_humanoid_results /tmp/full-torque-humanoid-self-model-study.zip
          python experiments/full_torque_humanoid/full_control_study.py \
            --output /tmp/full_torque_humanoid_results

      - name: Verify every required export exists
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/full_torque_humanoid_results/videos/control.mp4
          test -s /tmp/full_torque_humanoid_results/videos/weak_arm.mp4
          test -s /tmp/full_torque_humanoid_results/videos/weak_leg.mp4
          test -s /tmp/full_torque_humanoid_results/videos/combined.mp4
          test -s /tmp/full_torque_humanoid_results/videos/weak_arm_self_model_ablation.mp4
          test -s /tmp/full_torque_humanoid_results/data/episode_results.csv
          test -s /tmp/full_torque_humanoid_results/data/summary.csv
          test -s /tmp/full_torque_humanoid_results/data/study_manifest.json
          test -s /tmp/full-torque-humanoid-self-model-study.zip
          find /tmp/full_torque_humanoid_results -maxdepth 3 -type f -printf '%s %p\n' | sort -n

      - name: Upload complete downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-torque-humanoid-self-model-study
          path: |
            /tmp/full_torque_humanoid_results
            /tmp/full-torque-humanoid-self-model-study.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Publish every exported artifact on the study branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          destination=public/research/full-torque-humanoid
          rm -rf "$destination"
          mkdir -p "$destination"
          cp -a /tmp/full_torque_humanoid_results/. "$destination/"
          cp /tmp/full-torque-humanoid-self-model-study.zip "$destination/full-torque-humanoid-self-model-study.zip"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$destination" experiments/full_torque_humanoid/full_control_study.py
          git commit -m "publish full-torque humanoid study artifacts"
          git push origin HEAD:agent/full-torque-humanoid-self-model
