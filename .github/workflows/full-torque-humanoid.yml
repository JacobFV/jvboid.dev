name: full-torque humanoid self-model study

on:
  push:
    branches:
      - agent/full-torque-humanoid-self-model
    paths:
      - "experiments/full_torque_humanoid/**"
      - ".github/workflows/full-torque-humanoid.yml"
  pull_request:
    branches:
      - main
    paths:
      - "experiments/full_torque_humanoid/**"
      - ".github/workflows/full-torque-humanoid.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: full-torque-humanoid-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore exact study source
        shell: bash
        run: |
          set -euo pipefail
          echo "e6ca04a09f15cb950bec357095c65c61f9043decead3d427a8b4ea71b54df50f  experiments/full_torque_humanoid/archive.00.b64" | sha256sum --check --strict
          echo "438074a38768069a51d6c6e3ac7736c3751f6c7120f3582fb496057d41598c35  experiments/full_torque_humanoid/archive.01.b64" | sha256sum --check --strict
          echo "19ee9a847fe798844e0832d1e13cecb37d09b1c9c804a7b554bb6d05828fe568  experiments/full_torque_humanoid/archive.02.b64" | sha256sum --check --strict
          echo "d901bfc85b9e940c58a3bceb3a0863fee5881401d799dd0b2109c1700f712474  experiments/full_torque_humanoid/archive.03.b64" | sha256sum --check --strict
          echo "65d15d2b46d7769835cbddb1c97e2e0382352984a4489f409623ef80d2a9ec13  experiments/full_torque_humanoid/archive.04.b64" | sha256sum --check --strict
          echo "491ca922a4553d1de938a874d6ae82ea78257d7897f363fe5dcc5ca9746db565  experiments/full_torque_humanoid/archive.05.b64" | sha256sum --check --strict
          cat experiments/full_torque_humanoid/archive.*.b64 > /tmp/full_control_study.py.gz.b64
          echo "343e815df8ce34aedec956633d7197044d34da787bbaf230bf7d8db1929a0a5f  /tmp/full_control_study.py.gz.b64" | sha256sum --check --strict
          base64 --decode /tmp/full_control_study.py.gz.b64 > /tmp/full_control_study.py.gz
          echo "d2ba591eb42e0b3fc5cd78d8e6b948919de2edb382cdf9c34d6246178e802f74  /tmp/full_control_study.py.gz" | sha256sum --check --strict
          gzip --test /tmp/full_control_study.py.gz
          gzip --decompress --stdout /tmp/full_control_study.py.gz > experiments/full_torque_humanoid/full_control_study.py
          echo "14afaf598c347cf2fee03499fb048d38ce03b77e6d8a7c915aa61cb708041291  experiments/full_torque_humanoid/full_control_study.py" | sha256sum --check --strict
          python -m py_compile experiments/full_torque_humanoid/full_control_study.py

      - name: Install rigid-body simulation and learning runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libosmesa6-dev libgl1-mesa-glx ffmpeg
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "mujoco>=3.2,<4" numpy pandas pillow imageio imageio-ffmpeg matplotlib

      - name: Validate the physical morphology and expert demonstrations
        shell: bash
        run: |
          set -euo pipefail
          python experiments/full_torque_humanoid/full_control_study.py --smoke-only

      - name: Train, evaluate, and render every policy
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/full_torque_humanoid_results /tmp/full-torque-humanoid-self-model-study.zip
          python experiments/full_torque_humanoid/full_control_study.py \
            --output /tmp/full_torque_humanoid_results

      - name: Verify every required export exists
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/full_torque_humanoid_results/videos/control.mp4
          test -s /tmp/full_torque_humanoid_results/videos/weak_arm.mp4
          test -s /tmp/full_torque_humanoid_results/videos/weak_leg.mp4
          test -s /tmp/full_torque_humanoid_results/videos/combined.mp4
          test -s /tmp/full_torque_humanoid_results/videos/weak_arm_self_model_ablation.mp4
          test -s /tmp/full_torque_humanoid_results/data/episode_results.csv
          test -s /tmp/full_torque_humanoid_results/data/summary.csv
          test -s /tmp/full_torque_humanoid_results/data/study_manifest.json
          test -s /tmp/full-torque-humanoid-self-model-study.zip
          find /tmp/full_torque_humanoid_results -maxdepth 3 -type f -printf '%s %p\n' | sort -n

      - name: Upload complete downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-torque-humanoid-self-model-study
          path: |
            /tmp/full_torque_humanoid_results
            /tmp/full-torque-humanoid-self-model-study.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Publish every exported artifact on the study branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          destination=public/research/full-torque-humanoid
          rm -rf "$destination"
          mkdir -p "$destination"
          cp -a /tmp/full_torque_humanoid_results/. "$destination/"
          cp /tmp/full-torque-humanoid-self-model-study.zip "$destination/full-torque-humanoid-self-model-study.zip"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$destination" experiments/full_torque_humanoid/full_control_study.py
          git commit -m "publish full-torque humanoid study artifacts"
          git push origin HEAD:agent/full-torque-humanoid-self-model
