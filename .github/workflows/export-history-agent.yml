name: export merged main history (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bundle:
    if: github.head_ref == 'agent/export-history-20260801'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: create exact main bundle
        run: git bundle create repository.bundle refs/remotes/origin/main:refs/heads/main
      - uses: actions/upload-artifact@v4
        with:
          name: merged-main-repository-bundle
          path: repository.bundle
          compression-level: 0
          retention-days: 1
