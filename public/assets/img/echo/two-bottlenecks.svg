<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-labelledby="title desc" font-family="Inter, system-ui, Arial, sans-serif">
  <title id="title">Two bottlenecks between a person and what we know of them</title>
  <desc id="desc">A wide interior organization narrows through the person's capacity for expression into surviving traces, then narrows again through our capacity for perception into what we actually know. The width of the last stage does not measure the width of the first.</desc>
  <style>
    :root { --svg-primary: #0f172a; --svg-secondary: #64748b; --svg-muted: #94a3b8; --svg-soft: #475569; --svg-line: #cbd5e1; --svg-divider: #e2e8f0; --svg-inverse: #ffffff; --svg-accent: #b45309; --svg-fill: #f8fafc; }
    @media (prefers-color-scheme: dark) {
      :root { --svg-primary: #e5e7eb; --svg-secondary: #a1a1aa; --svg-muted: #71717a; --svg-soft: #cbd5e1; --svg-line: #52525b; --svg-divider: #3f3f46; --svg-inverse: #111827; --svg-accent: #fbbf24; --svg-fill: #18181b; }
    }
  </style>
  <rect id="bg" width="980" height="520" fill="var(--svg-inverse)"/>
  <defs>
    <pattern id="dense" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="var(--svg-soft)"/>
      <circle cx="9" cy="9" r="1.5" fill="var(--svg-soft)"/>
    </pattern>
    <pattern id="mid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.5" fill="var(--svg-soft)"/>
      <circle cx="19" cy="19" r="1.5" fill="var(--svg-soft)"/>
    </pattern>
    <pattern id="thin" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.5" fill="var(--svg-soft)"/>
    </pattern>
    <marker id="arrA" markerWidth="9" markerHeight="9" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="var(--svg-accent)"/>
    </marker>
  </defs>

  <text x="60" y="52" font-size="22" font-weight="500" fill="var(--svg-primary)" letter-spacing="-0.01em">Everything we know of a person came through two bottlenecks</text>
  <text x="60" y="76" font-size="13" fill="var(--svg-secondary)">Their capacity for expression, then our capacity for perception. The width of the last stage is not a measurement of the first.</text>

  <!-- tapers -->
  <g fill="var(--svg-divider)" stroke="var(--svg-line)" stroke-width="1">
    <path d="M230 144 L350 209 L350 305 L230 370 Z"/>
    <path d="M520 209 L640 235 L640 279 L520 305 Z"/>
  </g>

  <!-- stages -->
  <g stroke="var(--svg-primary)" stroke-width="1">
    <rect x="60" y="144" width="170" height="226" fill="var(--svg-inverse)"/>
    <rect x="60" y="144" width="170" height="226" fill="url(#dense)" stroke="none"/>
    <rect x="60" y="144" width="170" height="226" fill="none"/>

    <rect x="350" y="209" width="170" height="96" fill="var(--svg-inverse)"/>
    <rect x="350" y="209" width="170" height="96" fill="url(#mid)" stroke="none"/>
    <rect x="350" y="209" width="170" height="96" fill="none"/>

    <rect x="640" y="235" width="170" height="44" fill="var(--svg-inverse)"/>
    <rect x="640" y="235" width="170" height="44" fill="url(#thin)" stroke="none"/>
    <rect x="640" y="235" width="170" height="44" fill="none"/>
  </g>

  <!-- stage labels -->
  <g text-anchor="middle" font-size="14" font-weight="500" fill="var(--svg-primary)">
    <text x="145" y="132">interior organization</text>
    <text x="435" y="197">surviving traces</text>
    <text x="725" y="223">what we know</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--svg-secondary)">
    <text x="145" y="392">billions of neurons, decades of history</text>
    <text x="435" y="327">notes, actions, conversations</text>
    <text x="725" y="301">a narrow window</text>
  </g>

  <!-- taper leaders and labels -->
  <g stroke="var(--svg-muted)" stroke-width="1" stroke-dasharray="2 3">
    <line x1="290" y1="341" x2="290" y2="396"/>
    <line x1="580" y1="294" x2="580" y2="396"/>
  </g>
  <g text-anchor="middle" font-size="12" font-style="italic" fill="var(--svg-soft)">
    <text x="290" y="414">their capacity for expression</text>
    <text x="580" y="414">our capacity for perception</text>
  </g>

  <text x="60" y="444" font-size="12.5" fill="var(--svg-secondary)">Low-dimensional observations can be informative without being sufficient. A narrow window onto a system does not establish</text>
  <text x="60" y="462" font-size="12.5" fill="var(--svg-secondary)">that the system itself has few degrees of freedom.</text>
  <text x="60" y="494" font-size="12.5" fill="var(--svg-accent)">A reconstruction has to run the whole chain backwards &#8212; which is why the target is the machinery, not a convincing surface.</text>
</svg>
