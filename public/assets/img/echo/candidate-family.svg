<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 510" role="img" aria-labelledby="title desc" font-family="Inter, system-ui, Arial, sans-serif">
  <title id="title">The compatible candidates need not form a linear subspace</title>
  <desc id="desc">Left: three disconnected regions of candidate space all explain the surviving evidence equally well, and their parameter mean falls outside every one of them. Right: a posterior that looks sharper because of stronger regularization has not learned anything more about the past.</desc>
  <style>
    :root { --svg-primary: #0f172a; --svg-secondary: #64748b; --svg-muted: #94a3b8; --svg-soft: #475569; --svg-line: #cbd5e1; --svg-divider: #e2e8f0; --svg-inverse: #ffffff; --svg-accent: #b45309; --svg-fill: #f8fafc; }
    @media (prefers-color-scheme: dark) {
      :root { --svg-primary: #e5e7eb; --svg-secondary: #a1a1aa; --svg-muted: #71717a; --svg-soft: #cbd5e1; --svg-line: #52525b; --svg-divider: #3f3f46; --svg-inverse: #111827; --svg-accent: #fbbf24; --svg-fill: #18181b; }
    }
  </style>
  <rect id="bg" width="980" height="510" fill="var(--svg-inverse)"/>

  <text x="60" y="52" font-size="22" font-weight="500" fill="var(--svg-primary)" letter-spacing="-0.01em">What the evidence leaves open is not a blur around one answer</text>
  <text x="60" y="76" font-size="13" fill="var(--svg-secondary)">The goal is a coherent organization, or an explicitly unresolved family &#8212; never a parameter mean.</text>

  <!-- LEFT: candidate space -->
  <rect x="60" y="120" width="500" height="300" fill="none" stroke="var(--svg-line)" stroke-width="1"/>
  <text x="72" y="140" font-size="11" fill="var(--svg-muted)" letter-spacing="0.06em">CANDIDATE SPACE &#920;</text>

  <g fill="var(--svg-divider)" stroke="var(--svg-primary)" stroke-width="1">
    <ellipse cx="170" cy="210" rx="74" ry="44" transform="rotate(-18 170 210)"/>
    <ellipse cx="420" cy="190" rx="68" ry="42" transform="rotate(10 420 190)"/>
    <ellipse cx="300" cy="350" rx="80" ry="42" transform="rotate(-6 300 350)"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="500" fill="var(--svg-primary)">
    <text x="170" y="207">A</text>
    <text x="420" y="184">B</text>
    <text x="300" y="347">C</text>
  </g>
  <g text-anchor="middle" font-size="10.5" fill="var(--svg-secondary)">
    <text x="170" y="222">different memories</text>
    <text x="420" y="199">different mechanism</text>
    <text x="300" y="362">different learning rule</text>
  </g>

  <!-- the mean -->
  <g stroke="var(--svg-accent)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="290" y1="243" x2="176" y2="212"/>
    <line x1="290" y1="243" x2="412" y2="196"/>
    <line x1="290" y1="243" x2="298" y2="326"/>
  </g>
  <g stroke="var(--svg-accent)" stroke-width="2">
    <line x1="283" y1="236" x2="297" y2="250"/>
    <line x1="297" y1="236" x2="283" y2="250"/>
  </g>
  <text x="306" y="262" font-size="11.5" fill="var(--svg-accent)">parameter mean:</text>
  <text x="306" y="277" font-size="11.5" fill="var(--svg-accent)">a system that was never</text>
  <text x="306" y="292" font-size="11.5" fill="var(--svg-accent)">a plausible candidate</text>

  <text x="60" y="444" font-size="12" fill="var(--svg-secondary)">All three regions explain every surviving trace equally well. They may sit far apart,</text>
  <text x="60" y="462" font-size="12" fill="var(--svg-secondary)">with different internal mechanisms and similar observable consequences.</text>

  <!-- RIGHT: sharpness is not knowledge -->
  <g stroke="var(--svg-line)" stroke-width="1">
    <line x1="640" y1="380" x2="920" y2="380"/>
  </g>
  <text x="780" y="398" text-anchor="middle" font-size="11" fill="var(--svg-muted)" letter-spacing="0.06em">ONE COORDINATE OF &#920;</text>

  <path d="M640 380 C 700 380, 700 240, 780 240 C 860 240, 860 380, 920 380" fill="none" stroke="var(--svg-primary)" stroke-width="1.4" stroke-dasharray="4 3"/>
  <path d="M640 380 C 762 380, 762 160, 780 160 C 798 160, 798 380, 920 380" fill="none" stroke="var(--svg-accent)" stroke-width="1.6"/>

  <!-- legend -->
  <g stroke-width="1.6" fill="none">
    <line x1="640" y1="420" x2="668" y2="420" stroke="var(--svg-primary)" stroke-dasharray="4 3"/>
    <line x1="640" y1="442" x2="668" y2="442" stroke="var(--svg-accent)"/>
  </g>
  <text x="676" y="424" font-size="12" fill="var(--svg-primary)">supported by the evidence</text>
  <text x="676" y="446" font-size="12" fill="var(--svg-accent)">sharpened by regularization</text>

  <text x="640" y="478" font-size="12" fill="var(--svg-secondary)">Same data, narrower answer, nothing new</text>
  <text x="640" y="496" font-size="12" fill="var(--svg-secondary)">learned about the person.</text>
</svg>
