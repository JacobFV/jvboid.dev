<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-labelledby="title desc" font-family="Inter, system-ui, Arial, sans-serif">
  <title id="title">The recurrent loop a reconstruction would have to recover</title>
  <desc id="desc">A six-node cycle — world, observation, perception, internal state, thoughts and candidate plans, action — with affect sitting in the middle as a small set of low-dimensional control variables that modulate perception, memory access, planning and action value. A dashed return path shows recall re-entering the loop as observation.</desc>
  <style>
    :root { --svg-primary: #0f172a; --svg-secondary: #64748b; --svg-muted: #94a3b8; --svg-soft: #475569; --svg-line: #cbd5e1; --svg-divider: #e2e8f0; --svg-inverse: #ffffff; --svg-accent: #b45309; --svg-fill: #f8fafc; }
    @media (prefers-color-scheme: dark) {
      :root { --svg-primary: #e5e7eb; --svg-secondary: #a1a1aa; --svg-muted: #71717a; --svg-soft: #cbd5e1; --svg-line: #52525b; --svg-divider: #3f3f46; --svg-inverse: #111827; --svg-accent: #fbbf24; --svg-fill: #18181b; }
    }
  </style>
  <rect id="bg" width="980" height="620" fill="var(--svg-inverse)"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="var(--svg-primary)"/>
    </marker>
    <marker id="arrA" markerWidth="9" markerHeight="9" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="var(--svg-accent)"/>
    </marker>
  </defs>

  <text x="60" y="52" font-size="22" font-weight="500" fill="var(--svg-primary)" letter-spacing="-0.01em">The loop, not the outputs</text>
  <text x="60" y="76" font-size="13" fill="var(--svg-secondary)">Reproducing old answers constrains this process. Generating characteristically personal new trajectories is the much stronger requirement.</text>

  <!-- cycle arrows -->
  <g stroke="var(--svg-primary)" stroke-width="1.2" fill="none" marker-end="url(#arr)">
    <line x1="314" y1="227" x2="405" y2="188"/>
    <line x1="531" y1="188" x2="622" y2="227"/>
    <line x1="686.5" y1="282" x2="686.5" y2="408"/>
    <line x1="622" y1="464" x2="531" y2="502"/>
    <line x1="409" y1="504" x2="318" y2="466"/>
    <line x1="253.5" y1="408" x2="253.5" y2="282"/>
  </g>

  <!-- nodes -->
  <g stroke="var(--svg-primary)" stroke-width="1" fill="var(--svg-inverse)">
    <rect x="155.5" y="226.5" width="196" height="52" rx="3"/>
    <rect x="372" y="134" width="196" height="52" rx="3"/>
    <rect x="588.5" y="226.5" width="196" height="52" rx="3"/>
    <rect x="588.5" y="411.5" width="196" height="52" rx="3"/>
    <rect x="372" y="504" width="196" height="52" rx="3"/>
    <rect x="155.5" y="411.5" width="196" height="52" rx="3"/>
  </g>
  <g text-anchor="middle" fill="var(--svg-primary)">
    <text x="253.5" y="249" font-size="14" font-weight="500">world</text>
    <text x="253.5" y="266" font-size="11" fill="var(--svg-secondary)">consequences return</text>

    <text x="470" y="157" font-size="14" font-weight="500">observation</text>
    <text x="470" y="174" font-size="11" fill="var(--svg-secondary)">real and recalled</text>

    <text x="686.5" y="249" font-size="14" font-weight="500">perception</text>
    <text x="686.5" y="266" font-size="11" fill="var(--svg-secondary)">read through the current state</text>

    <text x="686.5" y="434" font-size="13" font-weight="500">beliefs &#183; goals &#183; memories</text>
    <text x="686.5" y="451" font-size="11" fill="var(--svg-secondary)">machinery, not storage</text>

    <text x="470" y="527" font-size="13" font-weight="500">thoughts &amp; candidate plans</text>
    <text x="470" y="544" font-size="11" fill="var(--svg-secondary)">competing for attention</text>

    <text x="253.5" y="434" font-size="14" font-weight="500">action</text>
    <text x="253.5" y="451" font-size="11" fill="var(--svg-secondary)">changes world and actor alike</text>
  </g>

  <!-- affect: low-dimensional control variables in the middle -->
  <g>
    <rect x="370" y="318" width="200" height="54" rx="3" fill="var(--svg-inverse)" stroke="var(--svg-primary)" stroke-width="1"/>
    <text x="470" y="341" text-anchor="middle" font-size="14" font-weight="500" fill="var(--svg-primary)">affect</text>
    <text x="470" y="358" text-anchor="middle" font-size="11" fill="var(--svg-secondary)">a few control variables, distributed</text>
  </g>
  <g stroke="var(--svg-muted)" stroke-width="1" stroke-dasharray="3 3" fill="none">
    <line x1="570" y1="331" x2="640" y2="288"/>
    <line x1="570" y1="359" x2="640" y2="402"/>
    <line x1="370" y1="359" x2="300" y2="402"/>
    <line x1="470" y1="372" x2="470" y2="500"/>
  </g>
  <g fill="var(--svg-muted)">
    <circle cx="640" cy="288" r="2"/><circle cx="640" cy="402" r="2"/>
    <circle cx="300" cy="402" r="2"/><circle cx="470" cy="500" r="2"/>
  </g>

  <!-- recall return path -->
  <path d="M778 425 C 826 425, 826 265, 782 262" stroke="var(--svg-accent)" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arrA)"/>
  <text x="834" y="338" font-size="11.5" fill="var(--svg-accent)">recall re-enters</text>
  <text x="834" y="354" font-size="11.5" fill="var(--svg-accent)">as observation</text>

  <!-- side notes -->
  <text x="60" y="330" font-size="11.5" fill="var(--svg-secondary)">fear narrows which</text>
  <text x="60" y="346" font-size="11.5" fill="var(--svg-secondary)">futures get attention;</text>
  <text x="60" y="362" font-size="11.5" fill="var(--svg-secondary)">curiosity changes the</text>
  <text x="60" y="378" font-size="11.5" fill="var(--svg-secondary)">exploration policy;</text>
  <text x="60" y="394" font-size="11.5" fill="var(--svg-secondary)">attachment reprices</text>
  <text x="60" y="410" font-size="11.5" fill="var(--svg-secondary)">another person&#8217;s states</text>

  <text x="60" y="596" font-size="12.5" fill="var(--svg-secondary)">From the inside, running far faster than the world changes, the ordering inverts: internal first, action second, observation third.</text>
</svg>
