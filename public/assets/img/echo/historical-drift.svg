<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 570" role="img" aria-labelledby="title desc" font-family="Inter, system-ui, Arial, sans-serif">
  <title id="title">The hypothesised term, and the null it has to beat</title>
  <desc id="desc">Two panels over the same slice of candidate space. Left: the null, where the drift of the adjustable coordinates is exactly the apparatus's calibrated drift and noise. Right: the hypothesis, where an additional term bends the same field slightly toward an organization that has existed before.</desc>
  <style>
    :root { --svg-primary: #0f172a; --svg-secondary: #64748b; --svg-muted: #94a3b8; --svg-soft: #475569; --svg-line: #cbd5e1; --svg-divider: #e2e8f0; --svg-inverse: #ffffff; --svg-accent: #b45309; --svg-fill: #f8fafc; }
    @media (prefers-color-scheme: dark) {
      :root { --svg-primary: #e5e7eb; --svg-secondary: #a1a1aa; --svg-muted: #71717a; --svg-soft: #cbd5e1; --svg-line: #52525b; --svg-divider: #3f3f46; --svg-inverse: #111827; --svg-accent: #fbbf24; --svg-fill: #18181b; }
    }
  </style>
  <rect id="bg" width="980" height="570" fill="var(--svg-inverse)"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4.5" refY="2.25" orient="auto">
      <path d="M0,0 L4.5,2.25 L0,4.5 Z" fill="var(--svg-soft)"/>
    </marker>
    <g id="ar">
      <line x1="0" y1="0" x2="22" y2="0" stroke="var(--svg-soft)" stroke-width="1.2" marker-end="url(#arr)"/>
    </g>
  </defs>

  <text x="60" y="52" font-size="22" font-weight="500" fill="var(--svg-primary)" letter-spacing="-0.01em">One extra term, and everything rides on whether it is zero</text>
  <text x="60" y="76" font-size="13" fill="var(--svg-secondary)">A coarse-grained experimental parameterisation of the adjustable coordinates &#8212; not a fundamental equation.</text>

  <text x="490" y="126" text-anchor="middle" font-size="17" font-family="'JetBrains Mono', ui-monospace, monospace" fill="var(--svg-primary)">d&#952; = [ b&#8320;(&#952;, x, u) + &#955; r(&#952;, x, h) ] dt + &#963;(&#952;, x, u) dW(t)</text>

  <g stroke-width="1">
    <line x1="257" y1="138" x2="384" y2="138" stroke="var(--svg-line)"/>
    <line x1="404" y1="138" x2="530" y2="138" stroke="var(--svg-accent)"/>
    <line x1="598" y1="138" x2="788" y2="138" stroke="var(--svg-line)"/>
  </g>
  <g font-size="11" text-anchor="middle">
    <text x="320" y="154" fill="var(--svg-secondary)">calibrated drift</text>
    <text x="467" y="154" fill="var(--svg-accent)">the whole hypothesis</text>
    <text x="693" y="154" fill="var(--svg-secondary)">calibrated noise</text>
  </g>

  <rect x="90" y="196" width="380" height="252" fill="none" stroke="var(--svg-line)" stroke-width="1"/>
  <rect x="510" y="196" width="380" height="252" fill="none" stroke="var(--svg-line)" stroke-width="1"/>

  <text x="90" y="186" font-size="13" font-weight="500" fill="var(--svg-primary)">null: &#955; = 0</text>
  <text x="176" y="186" font-size="11.5" fill="var(--svg-secondary)">the field is exactly what the apparatus does</text>
  <text x="510" y="186" font-size="13" font-weight="500" fill="var(--svg-accent)">hypothesis: &#955; &gt; 0</text>
  <text x="632" y="186" font-size="11.5" fill="var(--svg-secondary)">the same field, bent toward what existed before</text>

    <use href="#ar" x="129" y="272"/>
    <use href="#ar" x="204" y="272"/>
    <use href="#ar" x="279" y="272"/>
    <use href="#ar" x="354" y="272"/>
    <use href="#ar" x="129" y="320"/>
    <use href="#ar" x="204" y="320"/>
    <use href="#ar" x="279" y="320"/>
    <use href="#ar" x="354" y="320"/>
    <use href="#ar" x="129" y="368"/>
    <use href="#ar" x="204" y="368"/>
    <use href="#ar" x="279" y="368"/>
    <use href="#ar" x="354" y="368"/>
    <use href="#ar" x="129" y="416"/>
    <use href="#ar" x="204" y="416"/>
    <use href="#ar" x="279" y="416"/>
    <use href="#ar" x="354" y="416"/>

    <use href="#ar" transform="translate(560 272) rotate(4) translate(-11 0)"/>
    <use href="#ar" transform="translate(635 272) rotate(6) translate(-11 0)"/>
    <use href="#ar" transform="translate(710 272) rotate(9) translate(-11 0)"/>
    <use href="#ar" transform="translate(785 272) rotate(17) translate(-11 0)"/>
    <use href="#ar" transform="translate(560 320) rotate(0) translate(-11 0)"/>
    <use href="#ar" transform="translate(635 320) rotate(0) translate(-11 0)"/>
    <use href="#ar" transform="translate(710 320) rotate(0) translate(-11 0)"/>
    <use href="#ar" transform="translate(785 320) rotate(0) translate(-11 0)"/>
    <use href="#ar" transform="translate(560 368) rotate(-4) translate(-11 0)"/>
    <use href="#ar" transform="translate(635 368) rotate(-6) translate(-11 0)"/>
    <use href="#ar" transform="translate(710 368) rotate(-9) translate(-11 0)"/>
    <use href="#ar" transform="translate(785 368) rotate(-17) translate(-11 0)"/>
    <use href="#ar" transform="translate(560 416) rotate(-8) translate(-11 0)"/>
    <use href="#ar" transform="translate(635 416) rotate(-11) translate(-11 0)"/>
    <use href="#ar" transform="translate(710 416) rotate(-16) translate(-11 0)"/>
    <use href="#ar" transform="translate(785 416) rotate(-26) translate(-11 0)"/>

  <g>
    <circle cx="845" cy="320" r="18" fill="none" stroke="var(--svg-accent)" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="845" cy="320" r="4" fill="var(--svg-accent)"/>
    <text x="845" y="292" text-anchor="middle" font-size="15" font-weight="500" fill="var(--svg-accent)">h</text>
  </g>

  <text x="60" y="484" font-size="12.5" fill="var(--svg-secondary)">h denotes a specified historical instantiation. One candidate form of the extra drift is r = &#8722;&#8711;&#952; C(h; &#952;), a history-dependent</text>
  <text x="60" y="502" font-size="12.5" fill="var(--svg-secondary)">reconstruction-cost landscape &#8212; but a landscape adjusted afterwards to explain whatever drift showed up would explain nothing.</text>
  <text x="60" y="534" font-size="12.5" fill="var(--svg-accent)">If the bend disappears once an omitted material or environmental state is included, the ordinary model improved &#8212; a real, different result.</text>
</svg>
