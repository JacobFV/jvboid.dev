<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" role="img" aria-labelledby="title desc" font-family="Inter, system-ui, Arial, sans-serif">
  <title id="title">One generative model, one evidence model</title>
  <desc id="desc">A generative model proposes candidate brain-body organizations; simulated trajectories are scored by an evidence model against surviving traces; candidates are retained, varied and tested again. Below, three kinds of evidence with different error structures, and the ceiling the digital stage eventually reaches.</desc>
  <style>
    :root { --svg-primary: #0f172a; --svg-secondary: #64748b; --svg-muted: #94a3b8; --svg-soft: #475569; --svg-line: #cbd5e1; --svg-divider: #e2e8f0; --svg-inverse: #ffffff; --svg-accent: #b45309; --svg-fill: #f8fafc; }
    @media (prefers-color-scheme: dark) {
      :root { --svg-primary: #e5e7eb; --svg-secondary: #a1a1aa; --svg-muted: #71717a; --svg-soft: #cbd5e1; --svg-line: #52525b; --svg-divider: #3f3f46; --svg-inverse: #111827; --svg-accent: #fbbf24; --svg-fill: #18181b; }
    }
  </style>
  <rect id="bg" width="980" height="580" fill="var(--svg-inverse)"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="var(--svg-primary)"/>
    </marker>
  </defs>

  <text x="60" y="52" font-size="22" font-weight="500" fill="var(--svg-primary)" letter-spacing="-0.01em">The digital stage is one loop between two models</text>
  <text x="60" y="76" font-size="13" fill="var(--svg-secondary)">Gradient fitting, posterior sampling and population search are implementations of the same relationship, not alternatives to it.</text>

  <!-- the two models -->
  <g stroke="var(--svg-primary)" stroke-width="1" fill="var(--svg-inverse)">
    <rect x="90" y="118" width="300" height="116" rx="3"/>
    <rect x="590" y="118" width="300" height="116" rx="3"/>
  </g>
  <g fill="var(--svg-primary)">
    <text x="110" y="145" font-size="15" font-weight="500">generative model</text>
    <text x="610" y="145" font-size="15" font-weight="500">evidence model</text>
  </g>
  <g font-size="11.5" fill="var(--svg-secondary)">
    <text x="110" y="170">proposes candidate organizations &#952;:</text>
    <text x="110" y="188">connectivity, process parameters,</text>
    <text x="110" y="206">learned associations, body properties</text>
    <text x="610" y="170">scores how well a candidate explains</text>
    <text x="610" y="188">the surviving traces, and predicts</text>
    <text x="610" y="206">traces held back from the fitting</text>
  </g>

  <!-- loop between them -->
  <g stroke="var(--svg-primary)" stroke-width="1.2" fill="none" marker-end="url(#arr)">
    <path d="M390 152 L586 152"/>
    <path d="M590 200 L394 200"/>
  </g>
  <text x="488" y="145" text-anchor="middle" font-size="11.5" fill="var(--svg-soft)">simulate</text>
  <text x="488" y="219" text-anchor="middle" font-size="11.5" fill="var(--svg-soft)">retain &#183; vary</text>

  <!-- posterior -->
  <text x="490" y="278" text-anchor="middle" font-size="17" font-family="'JetBrains Mono', ui-monospace, monospace" fill="var(--svg-primary)">p(&#952;, x&#8320; | e) &#8733; p(e | &#952;, x&#8320;) &#183; p(&#952;, x&#8320;)</text>
  <g stroke="var(--svg-accent)" stroke-width="1">
    <line x1="458" y1="288" x2="572" y2="288"/>
    <line x1="598" y1="288" x2="692" y2="288"/>
  </g>
  <g font-size="11" fill="var(--svg-secondary)">
    <text x="458" y="306">likelihood &#8212; this particular person</text>
    <text x="598" y="324">prior &#8212; shared human anatomy and physiology</text>
  </g>

  <!-- evidence cards -->
  <g stroke="var(--svg-primary)" stroke-width="1" fill="var(--svg-inverse)">
    <rect x="85" y="344" width="250" height="106" rx="3"/>
    <rect x="365" y="344" width="250" height="106" rx="3"/>
    <rect x="645" y="344" width="250" height="106" rx="3"/>
  </g>
  <g fill="var(--svg-primary)" font-size="13" font-weight="500">
    <text x="105" y="370">a diary entry</text>
    <text x="385" y="370">a remembered disagreement</text>
    <text x="665" y="370">an electrophysiological trace</text>
  </g>
  <g font-size="11" fill="var(--svg-secondary)">
    <text x="105" y="392">self-selected, retrospective,</text>
    <text x="105" y="408">written for an audience</text>
    <text x="385" y="392">reconstructed on every retelling,</text>
    <text x="385" y="408">shaped by the person remembering</text>
    <text x="665" y="392">precise about signal, mute about</text>
    <text x="665" y="408">the context that produced it</text>
  </g>
  <!-- error bars of different width -->
  <g stroke="var(--svg-accent)" stroke-width="1.6">
    <line x1="105" y1="430" x2="205" y2="430"/><line x1="105" y1="425" x2="105" y2="435"/><line x1="205" y1="425" x2="205" y2="435"/>
    <line x1="385" y1="430" x2="565" y2="430"/><line x1="385" y1="425" x2="385" y2="435"/><line x1="565" y1="425" x2="565" y2="435"/>
    <line x1="665" y1="430" x2="705" y2="430"/><line x1="665" y1="425" x2="665" y2="435"/><line x1="705" y1="425" x2="705" y2="435"/>
  </g>

  <text x="60" y="486" font-size="12.5" fill="var(--svg-secondary)">Different error structures. Ten retellings of one event do not become ten independent constraints, and missing context must be</text>
  <text x="60" y="504" font-size="12.5" fill="var(--svg-secondary)">integrated over rather than quietly fixed to whichever imagined circumstance makes the candidate look best.</text>
  <text x="60" y="536" font-size="12.5" fill="var(--svg-accent)">The ceiling: once different organizations explain every available trace, a sharper posterior bought with stronger regularization</text>
  <text x="60" y="554" font-size="12.5" fill="var(--svg-accent)">is stronger preference, not new historical knowledge.</text>
</svg>
