<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t1 d1">
  <title id="t1">lifelogger system diagram</title>
  <desc id="d1">Local activity signals are reduced into a compact on-device event store, summarized in batched LLM calls, and surfaced as review notes whose corrections tune the next summary window.</desc>
  <rect width="1000" height="520" rx="26" fill="#ece7dc"/>

  <!-- on-device privacy boundary -->
  <rect x="28" y="86" width="556" height="410" rx="22" fill="#e4decd"
        stroke="#a89c7e" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>
  <rect x="48" y="74" width="296" height="24" rx="12" fill="#23251f"/>
  <path d="M59 85v-2.5a4 4 0 0 1 8 0v2.5M57 85h12v8H57z" fill="none" stroke="#ece7dc" stroke-width="1.7"/>
  <text x="78" y="90" font-family="ui-monospace,Menlo,monospace" font-size="11" font-weight="600" fill="#ece7dc">on-device — raw behavior stays local</text>

  <!-- stage 1: local signals -->
  <rect x="52" y="120" width="198" height="346" rx="16" fill="#fbf8f0" stroke="#cfc8b4" stroke-width="1.5"/>
  <text x="74" y="156" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="600" fill="#22241f">Local signals</text>
  <g fill="none" stroke="#2e7d78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(74 178)"><circle cx="9" cy="9" r="3.4"/><path d="M9 0v5.6M9 12.4V18"/></g>
    <g transform="translate(74 222)"><rect x="0" y="1" width="18" height="16" rx="2.5"/><path d="M0 6.5h18"/></g>
    <g transform="translate(74 266)"><rect x="0" y="2" width="18" height="15" rx="2.5"/><path d="M0 7.5h18M5 0v4M13 0v4"/></g>
    <g transform="translate(74 310)"><rect x="0" y="1" width="18" height="16" rx="2.5"/><path d="M4 6l4 3.5-4 3.5M10.5 13.5h4.5"/></g>
    <g transform="translate(74 354)"><rect x="0" y="1" width="18" height="16" rx="2.5"/><path d="M0 7h18"/></g>
  </g>
  <g font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#5d6058">
    <text x="104" y="192">git commits</text>
    <text x="104" y="236">browser history</text>
    <text x="104" y="280">calendar events</text>
    <text x="104" y="324">terminal sessions</text>
    <text x="104" y="368">foreground app</text>
  </g>
  <path d="M72 392h158" stroke="#e7e1ce" stroke-width="1.5"/>
  <g font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#8e8f84">
    <text x="74" y="416">each event tagged with</text>
    <text x="74" y="434">time · source · confidence</text>
    <text x="74" y="452">· privacy level</text>
  </g>

  <!-- stage 2: reducer -->
  <rect x="286" y="120" width="190" height="232" rx="16" fill="#fbf8f0" stroke="#cfc8b4" stroke-width="1.5"/>
  <text x="308" y="156" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="600" fill="#22241f">Reducer</text>
  <text x="308" y="177" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-style="italic" fill="#9a917a">noisy in → compact out</text>
  <g font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#5d6058">
    <circle cx="312" cy="205" r="3" fill="#2e7d78"/><text x="328" y="210">normalize events</text>
    <circle cx="312" cy="239" r="3" fill="#2e7d78"/><text x="328" y="244">dedupe evidence</text>
    <circle cx="312" cy="273" r="3" fill="#2e7d78"/><text x="328" y="278">group work sessions</text>
    <circle cx="312" cy="307" r="3" fill="#2e7d78"/><text x="328" y="312">redact private fields</text>
  </g>

  <!-- local event store -->
  <path d="M300 396v52c0 9 36 16 81 16s81-7 81-16v-52" fill="#e7efec" stroke="#2e7d78" stroke-width="1.8"/>
  <ellipse cx="381" cy="396" rx="81" ry="16" fill="#eef4f1" stroke="#2e7d78" stroke-width="1.8"/>
  <text x="381" y="431" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="600" fill="#2e7d78">local event store</text>

  <!-- stage 3: summarizer -->
  <rect x="600" y="120" width="220" height="232" rx="16" fill="#fbf8f0" stroke="#cfc8b4" stroke-width="1.5"/>
  <text x="622" y="156" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="600" fill="#22241f">Staged summarizer</text>
  <text x="622" y="177" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-style="italic" fill="#9a917a">batched LLM calls</text>
  <g font-family="ui-monospace,Menlo,monospace" font-size="12.5" fill="#5d6058">
    <circle cx="626" cy="205" r="3" fill="#2e7d78"/><text x="642" y="210">hourly · daily · weekly</text>
    <circle cx="626" cy="239" r="3" fill="#2e7d78"/><text x="642" y="244">batches all API calls</text>
    <circle cx="626" cy="273" r="3" fill="#2e7d78"/><text x="642" y="278">cites past summaries</text>
    <circle cx="626" cy="307" r="3" fill="#2e7d78"/><text x="642" y="312">bounded token cost</text>
  </g>

  <!-- stage 4: review surfaces -->
  <rect x="848" y="120" width="128" height="346" rx="16" fill="#fbf8f0" stroke="#cfc8b4" stroke-width="1.5"/>
  <text x="868" y="152" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="600" fill="#22241f">Review</text>
  <text x="868" y="174" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="600" fill="#22241f">surfaces</text>
  <g font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#5d6058">
    <circle cx="870" cy="220" r="3" fill="#b07527"/><text x="884" y="225">daily</text><text x="884" y="243">narrative</text>
    <circle cx="870" cy="289" r="3" fill="#b07527"/><text x="884" y="294">weekly arc</text>
    <circle cx="870" cy="339" r="3" fill="#b07527"/><text x="884" y="344">site updates</text>
    <circle cx="870" cy="389" r="3" fill="#b07527"/><text x="884" y="394">corrections</text>
  </g>

  <defs>
    <marker id="af" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1l9 5-9 5z" fill="#2e7d78"/>
    </marker>
    <marker id="ab" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1l9 5-9 5z" fill="#b07527"/>
    </marker>
  </defs>

  <!-- flow arrows -->
  <g fill="none" stroke="#2e7d78" stroke-width="3.4" stroke-linecap="round">
    <path d="M250 236h28" marker-end="url(#af)"/>
    <path d="M381 352v36" marker-end="url(#af)"/>
    <path d="M462 430C548 430 520 236 592 236" marker-end="url(#af)"/>
    <path d="M820 236h20" marker-end="url(#af)"/>
  </g>
  <text x="503" y="424" font-family="ui-monospace,Menlo,monospace" font-size="11" font-weight="600" fill="#7d7f74">batched ·</text>
  <text x="503" y="440" font-family="ui-monospace,Menlo,monospace" font-size="11" font-weight="600" fill="#7d7f74">redacted</text>

  <!-- feedback loop -->
  <path d="M912 466C912 502 742 504 710 360" fill="none" stroke="#b07527" stroke-width="3"
        stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#ab)"/>
  <text x="812" y="502" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" font-weight="600" fill="#b07527">corrections tune the next summary window</text>
</svg>
