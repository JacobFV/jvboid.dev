<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">SynthUX surface-to-app matrix</title>
  <desc id="desc">A 7 by 3 matrix showing which native app drives each SynthUX surface across browser-os, windows-web-next, and macos-web-next.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0c111b"/>
      <stop offset="1" stop-color="#171a25"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" x2="1">
      <stop offset="0" stop-color="#f8d27a"/>
      <stop offset="1" stop-color="#d08b45"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" x2="1">
      <stop offset="0" stop-color="#7bd5df"/>
      <stop offset="1" stop-color="#8fb2ff"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" x2="1">
      <stop offset="0" stop-color="#b09bff"/>
      <stop offset="1" stop-color="#7d6bff"/>
    </linearGradient>
    <linearGradient id="sage" x1="0" x2="1">
      <stop offset="0" stop-color="#a8d8a8"/>
      <stop offset="1" stop-color="#6fb37c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .h1{font:700 38px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f4efe3}
      .sub{font:500 16px Inter,ui-sans-serif,system-ui,sans-serif;fill:#9aa3b2}
      .col{font:700 18px Inter,ui-sans-serif,system-ui,sans-serif;fill:#e9e3d3}
      .row{font:700 18px Inter,ui-sans-serif,system-ui,sans-serif;fill:#cbbfff}
      .cell{font:600 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#9cd2d8}
      .note{font:500 14px Inter,ui-sans-serif,system-ui,sans-serif;fill:#7d8694}
    </style>
  </defs>

  <rect width="1400" height="780" fill="url(#bg)"/>

  <text x="68" y="74" class="h1">Surface → app, per simulator</text>
  <text x="68" y="106" class="sub">21 compilers. Each terminal node is driven through the native simulator app for its surface.</text>

  <!-- Column headers -->
  <g transform="translate(360, 170)">
    <rect width="320" height="56" rx="14" fill="#11212b" stroke="#2d4e5e" filter="url(#shadow)"/>
    <circle cx="32" cy="28" r="10" fill="url(#cyan)"/>
    <text x="54" y="34" class="col">browser-os</text>
    <text x="54" y="52" class="note" fill="#6c7a8a">React desktop shell</text>
  </g>
  <g transform="translate(700, 170)">
    <rect width="320" height="56" rx="14" fill="#11212b" stroke="#2d4e5e" filter="url(#shadow)"/>
    <circle cx="32" cy="28" r="10" fill="url(#cyan)"/>
    <text x="54" y="34" class="col">windows-web-next</text>
    <text x="54" y="52" class="note" fill="#6c7a8a">Svelte Windows 11</text>
  </g>
  <g transform="translate(1040, 170)">
    <rect width="320" height="56" rx="14" fill="#11212b" stroke="#2d4e5e" filter="url(#shadow)"/>
    <circle cx="32" cy="28" r="10" fill="url(#cyan)"/>
    <text x="54" y="34" class="col">macos-web-next</text>
    <text x="54" y="52" class="note" fill="#6c7a8a">Svelte macOS</text>
  </g>

  <!-- Row helper -->
  <!-- y positions: 250, 318, 386, 454, 522, 590, 658 -->
  <!-- Row label box at x=60 width=280, height=56 -->

  <!-- Row: terminal -->
  <g transform="translate(60, 250)">
    <rect width="280" height="56" rx="14" fill="#191628" stroke="#3a3460" filter="url(#shadow)"/>
    <text x="20" y="34" class="row">terminal</text>
    <text x="20" y="52" class="note">shell · process · stdout</text>
  </g>
  <g transform="translate(360, 250)"><rect width="320" height="56" rx="14" fill="#11181f" stroke="#2c3548"/><text x="20" y="34" class="cell">terminal</text><text x="20" y="52" class="note">xterm + commands</text></g>
  <g transform="translate(700, 250)"><rect width="320" height="56" rx="14" fill="#11181f" stroke="#2c3548"/><text x="20" y="34" class="cell">terminal</text><text x="20" y="52" class="note">PowerShell-style</text></g>
  <g transform="translate(1040, 250)"><rect width="320" height="56" rx="14" fill="#11181f" stroke="#2c3548"/><text x="20" y="34" class="cell">terminal</text><text x="20" y="52" class="note">Terminal.app</text></g>

  <!-- Row: editor -->
  <g transform="translate(60, 318)">
    <rect width="280" height="56" rx="14" fill="#191628" stroke="#3a3460" filter="url(#shadow)"/>
    <text x="20" y="34" class="row">editor</text>
    <text x="20" y="52" class="note">files · code · buffers</text>
  </g>
  <g transform="translate(360, 318)"><rect width="320" height="56" rx="14" fill="#11181f" stroke="#2c3548"/><text x="20" y="34" class="cell">notepad</text><text x="20" y="52" class="note">single textarea</text></g>
  <g transform="translate(700, 318)"><rect width="320" height="56" rx="14" fill="#11181f" stroke="#2c3548"/><text x="20" y="34" class="cell">vscode</text><text x="20" y="52" class="note">Monaco view-lines</text></g>
  <g transform="translate(1040, 318)"><rect width="320" height="56" rx="14" fill="#11181f" stroke="#2c3548"/><text x="20" y="34" class="cell">vscode</text><text x="20" y="52" class="note">Monaco view-lines</text></g>

  <!-- Row: notion -->
  <g transform="translate(60, 386)">
    <rect width="280" height="56" rx="14" fill="#191628" stroke="#3a3460" filter="url(#shadow)"/>
    <text x="20" y="34" class="row">notion</text>
    <text x="20" y="52" class="note">docs · checklists · notes</text>
  </g>
  <g transform="translate(360, 386)"><rect width="320" height="56" rx="14" fill="#11181f" stroke="#2c3548"/><text x="20" y="34" class="cell">notes</text><text x="20" y="52" class="note">title + body textarea</text></g>
  <g transform="translate(700, 386)"><rect width="320" height="56" rx="14" fill="#11181f" stroke="#2c3548"/><text x="20" y="34" class="cell">wordpad</text><text x="20" y="52" class="note">document body</text></g>
  <g transform="translate(1040, 386)"><rect width="320" height="56" rx="14" fill="#11181f" stroke="#2c3548"/><text x="20" y="34" class="cell">notes</text><text x="20" y="52" class="note">contenteditable</text></g>

  <!-- Row: slack -->
  <g transform="translate(60, 454)">
    <rect width="280" height="56" rx="14" fill="#191628" stroke="#3a3460" filter="url(#shadow)"/>
    <text x="20" y="34" class="row">slack</text>
    <text x="20" y="52" class="note">chat · messages · threads</text>
  </g>
  <g transform="translate(360, 454)"><rect width="320" height="56" rx="14" fill="#11181f" stroke="#2c3548"/><text x="20" y="34" class="cell">messaging-client</text><text x="20" y="52" class="note">conversation + send</text></g>
  <g transform="translate(700, 454)"><rect width="320" height="56" rx="14" fill="#11181f" stroke="#2c3548"/><text x="20" y="34" class="cell">mail</text><text x="20" y="52" class="note">compose body</text></g>
  <g transform="translate(1040, 454)"><rect width="320" height="56" rx="14" fill="#11181f" stroke="#2c3548"/><text x="20" y="34" class="cell">messages</text><text x="20" y="52" class="note">iMessage input</text></g>

  <!-- Row: browser -->
  <g transform="translate(60, 522)">
    <rect width="280" height="56" rx="14" fill="#191628" stroke="#3a3460" filter="url(#shadow)"/>
    <text x="20" y="34" class="row">browser</text>
    <text x="20" y="52" class="note">url · search · navigate</text>
  </g>
  <g transform="translate(360, 522)"><rect width="320" height="56" rx="14" fill="#11181f" stroke="#2c3548"/><text x="20" y="34" class="cell">browser</text><text x="20" y="52" class="note">URL or search</text></g>
  <g transform="translate(700, 522)"><rect width="320" height="56" rx="14" fill="#11181f" stroke="#2c3548"/><text x="20" y="34" class="cell">edge</text><text x="20" y="52" class="note">address bar</text></g>
  <g transform="translate(1040, 522)"><rect width="320" height="56" rx="14" fill="#11181f" stroke="#2c3548"/><text x="20" y="34" class="cell">safari</text><text x="20" y="52" class="note">smart search field</text></g>

  <!-- Row: github -->
  <g transform="translate(60, 590)">
    <rect width="280" height="56" rx="14" fill="#191628" stroke="#3a3460" filter="url(#shadow)"/>
    <text x="20" y="34" class="row">github</text>
    <text x="20" y="52" class="note">repos · PRs · reviews</text>
  </g>
  <g transform="translate(360, 590)"><rect width="320" height="56" rx="14" fill="#11181f" stroke="#2c3548"/><text x="20" y="34" class="cell">browser → github.com</text><text x="20" y="52" class="note">resolved URL per action</text></g>
  <g transform="translate(700, 590)"><rect width="320" height="56" rx="14" fill="#11181f" stroke="#2c3548"/><text x="20" y="34" class="cell">edge → github.com</text><text x="20" y="52" class="note">resolved URL per action</text></g>
  <g transform="translate(1040, 590)"><rect width="320" height="56" rx="14" fill="#11181f" stroke="#2c3548"/><text x="20" y="34" class="cell">safari → github.com</text><text x="20" y="52" class="note">resolved URL per action</text></g>

  <!-- Row: dashboard -->
  <g transform="translate(60, 658)">
    <rect width="280" height="56" rx="14" fill="#191628" stroke="#3a3460" filter="url(#shadow)"/>
    <text x="20" y="34" class="row">dashboard</text>
    <text x="20" y="52" class="note">panels · alerts · time range</text>
  </g>
  <g transform="translate(360, 658)"><rect width="320" height="56" rx="14" fill="#11181f" stroke="#2c3548"/><text x="20" y="34" class="cell">browser → grafana</text><text x="20" y="52" class="note">/d/&lt;dash&gt;</text></g>
  <g transform="translate(700, 658)"><rect width="320" height="56" rx="14" fill="#11181f" stroke="#2c3548"/><text x="20" y="34" class="cell">edge → grafana</text><text x="20" y="52" class="note">/d/&lt;dash&gt;</text></g>
  <g transform="translate(1040, 658)"><rect width="320" height="56" rx="14" fill="#11181f" stroke="#2c3548"/><text x="20" y="34" class="cell">safari → grafana</text><text x="20" y="52" class="note">/d/&lt;dash&gt;</text></g>

  <text x="68" y="744" class="note">When a compiler's selector misses the live DOM, the row falls back to a workbench overlay and is tagged state.used_fallback for the validator to flag.</text>
</svg>
