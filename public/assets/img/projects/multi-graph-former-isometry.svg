<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Transformer attention as graph neural network message passing</title>
  <desc id="desc">Diagram mapping a sequence transformer to a graph neural network with tokens as vertices, attention as weighted edges, and input, working memory, and output graphs connected by cross graph attention.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <linearGradient id="panelA" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="panelB" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#dcfce7"/>
    </linearGradient>
    <style>
      .bg { fill: #f8fafc; }
      .panel { stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .label { fill: #0f172a; font: 700 28px Inter, ui-sans-serif, system-ui, sans-serif; }
      .sub { fill: #475569; font: 500 18px Inter, ui-sans-serif, system-ui, sans-serif; }
      .small { fill: #475569; font: 500 15px Inter, ui-sans-serif, system-ui, sans-serif; }
      .math { fill: #0f172a; font: 600 22px Inter, ui-sans-serif, system-ui, sans-serif; }
      .node { stroke: #0f172a; stroke-width: 2.5; }
      .tok { fill: #bae6fd; }
      .wm { fill: #bbf7d0; }
      .out { fill: #fde68a; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.4; opacity: 0.72; marker-end: url(#arrow); }
      .edgeSoft { fill: none; stroke: #64748b; stroke-width: 1.8; opacity: 0.35; }
      .edgeStrong { fill: none; stroke: #0f766e; stroke-width: 3.6; opacity: 0.9; marker-end: url(#arrow); }
      .brace { fill: none; stroke: #334155; stroke-width: 2; }
      .pill { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="720"/>

  <rect class="panel" x="48" y="56" width="500" height="585" fill="url(#panelA)"/>
  <rect class="panel" x="652" y="56" width="500" height="585" fill="url(#panelB)"/>

  <text class="label" x="90" y="112">Transformer view</text>
  <text class="sub" x="90" y="144">A sequence is a complete directed graph over tokens</text>

  <g transform="translate(0 10)">
    <circle class="node tok" cx="150" cy="280" r="34"/>
    <circle class="node tok" cx="250" cy="280" r="34"/>
    <circle class="node tok" cx="350" cy="280" r="34"/>
    <circle class="node tok" cx="450" cy="280" r="34"/>
    <text class="math" x="139" y="287">x1</text>
    <text class="math" x="239" y="287">x2</text>
    <text class="math" x="339" y="287">x3</text>
    <text class="math" x="439" y="287">x4</text>

    <path class="edgeSoft" d="M 184 280 C 205 220 295 220 316 280"/>
    <path class="edgeStrong" d="M 184 280 C 238 175 362 175 416 280"/>
    <path class="edgeSoft" d="M 284 280 C 304 240 330 240 350 280"/>
    <path class="edgeSoft" d="M 416 280 C 365 365 235 365 184 280"/>
    <path class="edgeSoft" d="M 250 246 C 250 190 350 190 350 246"/>
  </g>

  <rect class="pill" x="94" y="410" width="360" height="70"/>
  <text class="math" x="118" y="438">A = softmax(QK^T / sqrt(d))</text>
  <text class="small" x="118" y="464">attention matrix = learned edge weights</text>

  <rect class="pill" x="94" y="500" width="360" height="70"/>
  <text class="math" x="118" y="528">H' = A V W_o</text>
  <text class="small" x="118" y="554">node update = weighted message aggregation</text>

  <text class="small" x="90" y="606">If every token can attend to every token, the sequence is a graph.</text>

  <text class="label" x="694" y="112">Multi-graph-former view</text>
  <text class="sub" x="694" y="144">Generalize one token graph into typed interacting graphs</text>

  <g>
    <text class="small" x="746" y="206">input graph</text>
    <circle class="node tok" cx="730" cy="255" r="26"/>
    <circle class="node tok" cx="790" cy="255" r="26"/>
    <circle class="node tok" cx="850" cy="255" r="26"/>
    <path class="edge" d="M 756 255 L 764 255"/>
    <path class="edge" d="M 816 255 L 824 255"/>
    <path class="edgeSoft" d="M 850 230 C 806 184 774 184 730 230"/>

    <text class="small" x="854" y="384">working memory graph</text>
    <circle class="node wm" cx="850" cy="440" r="30"/>
    <circle class="node wm" cx="940" cy="410" r="30"/>
    <circle class="node wm" cx="1015" cy="472" r="30"/>
    <path class="edgeStrong" d="M 875 424 L 913 414"/>
    <path class="edgeStrong" d="M 965 428 L 990 452"/>
    <path class="edgeSoft" d="M 1015 442 C 1000 370 890 360 850 410"/>

    <text class="small" x="735" y="552">output graph</text>
    <circle class="node out" cx="725" cy="600" r="26"/>
    <circle class="node out" cx="790" cy="600" r="26"/>
    <circle class="node out" cx="855" cy="600" r="26"/>
    <path class="edge" d="M 751 600 L 764 600"/>
    <path class="edge" d="M 816 600 L 829 600"/>

    <path class="edgeStrong" d="M 850 282 C 860 330 875 365 895 388"/>
    <path class="edgeStrong" d="M 790 282 C 810 355 828 398 850 430"/>
    <path class="edgeStrong" d="M 925 439 C 886 505 850 548 816 584"/>
    <path class="edgeStrong" d="M 1015 502 C 970 555 925 588 881 600"/>
  </g>

  <rect class="pill" x="690" y="174" width="190" height="48"/>
  <text class="small" x="710" y="204">sequence edges</text>
  <rect class="pill" x="884" y="174" width="225" height="48"/>
  <text class="small" x="904" y="204">learned cross-graph edges</text>

  <text class="small" x="694" y="628">Same operator shape, broader domain: relation-aware attention plus vertex and edge updates.</text>
</svg>
