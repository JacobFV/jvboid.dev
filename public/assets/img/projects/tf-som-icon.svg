    <circle cx="207" cy="196" r="17" fill="#7df9ff" opacity=".82"/>
    <circle cx="282" cy="151" r="22" fill="#8cff98"/>
    <circle cx="342" cy="211" r="27" fill="#8cff98" opacity=".86"/>
    <circle cx="188" cy="318" r="29" fill="#f7d46b"/>
    <circle cx="285" cy="354" r="18" fill="#f7d46b" opacity=".82"/>
    <circle cx="356" cy="316" r="25" fill="#ff8f70"/>
    <path d="M150 151 L207 196 M282 151 L342 211 M188 318 L285 354 L356 316" fill="none" stroke="#eaffff" stroke-width="5" stroke-opacity=".38"/>
