<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">tf-som app icon</title>
  <desc id="desc">A glowing self-organizing map grid with TensorFlow-style code sparks.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#173d44"/>
      <stop offset="58%" stop-color="#071820"/>
      <stop offset="100%" stop-color="#020506"/>
    </radialGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7df9ff"/>
      <stop offset="55%" stop-color="#8cff98"/>
      <stop offset="100%" stop-color="#f7d46b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
