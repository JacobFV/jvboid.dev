<svg data-palette="page" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 610" width="1320" height="610" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="t">IBM-1: one kernel, sixteen models, and a body</title>
  <desc id="d">One implicit kernel of 30,000 cortical sites (3.84M parameters) is materialized into sixteen explicit models (image to EEG, speech to MEG, next-frame video, audio-visual, optic and cochlear nerves, ten subjects), each only as far as its target reaches. Every 500 steps each model's replica is Procrustes-aligned, averaged back into the kernel and reset; heads are never shared. The same cortex closes a sensorimotor loop: the musculoskeletal body reports muscle length and velocity through 498 afferent ports to postcentral sites, precentral sites issue muscle commands through the spinal cord's reflex arcs back to the body, and a gamma efferent edge from the cord resets spindle gain.</desc>
  <defs>
    <marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#86868b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#1d1d1f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#0066cc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0" y="0" width="100%" height="100%" rx="18" fill="#fff"/>

  <!-- materialize down, fold back up: one two-headed line per model -->
  <g fill="none" stroke="#1d1d1f" stroke-width="1.5" marker-start="url(#a-ink)" marker-end="url(#a-ink)">
    <path d="M150 104 V150 H540 V200"/>
    <path d="M320 104 V150 H580 V200"/>
    <path d="M490 104 V150 H620 V200"/>
    <path d="M660 104 V150 H660 V200"/>
    <path d="M830 104 V150 H700 V200"/>
    <path d="M1000 104 V150 H740 V200"/>
    <path d="M1170 104 V150 H780 V200"/>
  </g>

  <!-- sensorimotor loop -->
  <g fill="none" stroke="#0066cc" stroke-width="1.5" marker-end="url(#a-blue)">
    <path d="M575 492 H230"/>
    <path d="M145 460 V372 H300"/>
    <path d="M385 340 V315 H580 V290"/>
    <path d="M740 290 V315 H935 V340"/>
    <path d="M1020 372 H1175 V460"/>
    <path d="M1090 492 H745"/>
    <path d="M1175 524 V565 H145 V524" stroke-dasharray="4 4"/>
  </g>

  <!-- boxes -->
  <g>
    <text x="75" y="27" font-size="12" fill="#6e6e73">Sixteen materialized models, by family</text>
    <rect x="75" y="40" width="150" height="64" rx="14" fill="#f5f5f7"/>
    <text x="150" y="77" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">image → EEG</text>
    <rect x="245" y="40" width="150" height="64" rx="14" fill="#f5f5f7"/>
    <text x="320" y="77" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">speech → MEG</text>
    <rect x="415" y="40" width="150" height="64" rx="14" fill="#f5f5f7"/>
    <text x="490" y="77" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">next frame</text>
    <rect x="585" y="40" width="150" height="64" rx="14" fill="#f5f5f7"/>
    <text x="660" y="77" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">audio-visual</text>
    <rect x="755" y="40" width="150" height="64" rx="14" fill="#f5f5f7"/>
    <text x="830" y="77" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">optic nerve</text>
    <rect x="925" y="40" width="150" height="64" rx="14" fill="#f5f5f7"/>
    <text x="1000" y="77" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">cochlear nerve</text>
    <rect x="1095" y="40" width="150" height="64" rx="14" fill="#f5f5f7"/>
    <text x="1170" y="77" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">10 subjects</text>

    <rect x="510" y="200" width="300" height="90" rx="18" fill="#f5f5f7"/>
    <text x="660" y="235" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">Implicit kernel</text>
    <text x="660" y="255" text-anchor="middle" font-size="12" fill="#6e6e73">30,000 cortical sites × 128 = 3.84M</text>
    <text x="660" y="274" text-anchor="middle" font-size="11" fill="#6e6e73">shared by every model; heads never are</text>

    <rect x="300" y="340" width="170" height="64" rx="14" fill="#f5f5f7"/>
    <text x="385" y="368" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">Postcentral sites</text>
    <text x="385" y="387" text-anchor="middle" font-size="12" fill="#6e6e73">somatosensory</text>

    <rect x="850" y="340" width="170" height="64" rx="14" fill="#f5f5f7"/>
    <text x="935" y="368" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">Precentral sites</text>
    <text x="935" y="387" text-anchor="middle" font-size="12" fill="#6e6e73">motor</text>

    <rect x="60" y="460" width="170" height="64" rx="14" fill="#f5f5f7"/>
    <text x="145" y="488" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">Afferents</text>
    <text x="145" y="507" text-anchor="middle" font-size="12" fill="#6e6e73">498 sensory ports</text>

    <rect x="575" y="460" width="170" height="64" rx="14" fill="#fff" stroke="#d2d2d7"/>
    <text x="660" y="488" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">Body</text>
    <text x="660" y="507" text-anchor="middle" font-size="12" fill="#6e6e73">musculoskeletal</text>

    <rect x="1090" y="460" width="170" height="64" rx="14" fill="#f5f5f7"/>
    <text x="1175" y="488" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">Spinal cord</text>
    <text x="1175" y="507" text-anchor="middle" font-size="12" fill="#6e6e73">reflex arcs</text>
  </g>

  <!-- path labels -->
  <g font-size="11" fill="#6e6e73">
    <text x="420" y="178" text-anchor="end">materialize ↓  only as far as each target reaches</text>
    <text x="900" y="178" text-anchor="start">↑ fold back every 500 steps: Procrustes-align, average, reset</text>
    <text x="402" y="482" text-anchor="middle" fill="#0066cc">spindles · Golgi organs: length, velocity</text>
    <text x="918" y="482" text-anchor="middle" fill="#0066cc">muscle commands</text>
    <text x="660" y="582" text-anchor="middle" fill="#0066cc">γ efferent: resets spindle gain, the first closed cycle in the graph</text>
  </g>
</svg>
