<svg xmlns="http://www.w3.org/2000/svg" viewBox="38 43 1142 678" role="img" aria-labelledby="t d">
  <title id="t">runlaw: setting and rolling out a policy</title>
  <desc id="d">A policy is one JSON document: a name, a default mode, what to do if the judge fails, and a list of rules. Each rule has a type (pii, pattern, tool or semantic), the stages it watches (input, output, tool_call) and an action (flag, redact, rewrite, block or require_approval). You can replay a draft against recent real traces before saving it. Saving it from the console editor or with PUT /api/policy validates it and stores a new version, which applies from the next call. Run it in monitor mode first, then switch to enforce. To roll back, save an older version again.</desc>
  <defs>
    <marker id="a" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1l9 5-9 5z" fill="#062b8a"/></marker>
    <marker id="o" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1l9 5-9 5z" fill="#3a5aa8"/></marker>
    <marker id="g" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1l9 5-9 5z" fill="#6b80bf"/></marker>
    <style>
      .h{font:600 18px "Hanken Grotesk",ui-sans-serif,system-ui,sans-serif;fill:#062b8a}
      .n{font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#efe8da}
      .s{font:400 14px "Hanken Grotesk",ui-sans-serif,system-ui,sans-serif;fill:#3a5aa8}
      .m{font:500 12.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#062b8a}
      .r{font:500 12.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#03184f}
      .am{font:500 12.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#3a5aa8}
      .k{font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#6b80bf;letter-spacing:.08em}
      .card{fill:#efe8da;stroke:#a9b3d3;stroke-width:1.5}
      .key{fill:#efe8da;stroke:#062b8a;stroke-width:2}
      .hold{fill:#e6dbc7;stroke:#3a5aa8;stroke-width:1.8}
      .note{fill:none;stroke:#8c9ccc;stroke-width:1.4;stroke-dasharray:5 5}
      .ln{fill:none;stroke:#062b8a;stroke-width:2.2}
      .lo{fill:none;stroke:#3a5aa8;stroke-width:2}
      .lg{fill:none;stroke:#6b80bf;stroke-width:1.8;stroke-dasharray:5 5}
      .dot{fill:#062b8a}
    </style>
  </defs>
  <style>.c{font:500 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#ddd0b9;white-space:pre}.ck{fill:#8fa9ee}.cv{fill:#c7d3f5}.lk{font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#8c9ccc;letter-spacing:.08em}.lv{font:500 12.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#ddd0b9}</style>
  <text x="40" y="56" class="k">1 · WRITE THE POLICY AS JSON</text>
  <rect x="40" y="74" width="470" height="644" rx="0" fill="#062b8a"/>
  <text x="64" y="110" class="c">{</text>
  <text x="64" y="131" class="c">  <tspan class="ck">"name"</tspan>: "support",</text>
  <text x="64" y="152" class="c">  <tspan class="ck">"mode"</tspan>: "monitor",</text>
  <text x="64" y="173" class="c">  <tspan class="ck">"on_judge_error"</tspan>: "allow",</text>
  <text x="64" y="194" class="c">  <tspan class="ck">"rules"</tspan>: [</text>
  <text x="64" y="215" class="c">    { <tspan class="ck">"id"</tspan>: "redact-pii", <tspan class="ck">"type"</tspan>: "pii",</text>
  <text x="64" y="236" class="c">      <tspan class="ck">"on"</tspan>: ["input", "output"],</text>
  <text x="64" y="257" class="c">      <tspan class="ck">"detect"</tspan>: ["email", "card_number"],</text>
  <text x="64" y="278" class="c">      <tspan class="ck">"action"</tspan>: "redact" },</text>
  <text x="64" y="299" class="c">    { <tspan class="ck">"id"</tspan>: "refund-limit", <tspan class="ck">"type"</tspan>: "tool",</text>
  <text x="64" y="320" class="c">      <tspan class="ck">"on"</tspan>: ["tool_call"],</text>
  <text x="64" y="341" class="c">      <tspan class="ck">"tool"</tspan>: "issue_refund",</text>
  <text x="64" y="362" class="c">      <tspan class="ck">"when"</tspan>: { <tspan class="ck">"arg"</tspan>: "amount",</text>
  <text x="64" y="383" class="c">                <tspan class="ck">"op"</tspan>: "&gt;", <tspan class="ck">"value"</tspan>: 500 },</text>
  <text x="64" y="404" class="c">      <tspan class="ck">"action"</tspan>: "require_approval" },</text>
  <text x="64" y="425" class="c">    { <tspan class="ck">"id"</tspan>: "no-legal-advice",</text>
  <text x="64" y="446" class="c">      <tspan class="ck">"type"</tspan>: "semantic", <tspan class="ck">"on"</tspan>: ["output"],</text>
  <text x="64" y="467" class="c">      <tspan class="ck">"constraint"</tspan>: "Gives specific legal advice",</text>
  <text x="64" y="488" class="c">      <tspan class="ck">"threshold"</tspan>: 0.7,</text>
  <text x="64" y="509" class="c">      <tspan class="ck">"action"</tspan>: "rewrite" }</text>
  <text x="64" y="530" class="c">  ]</text>
  <text x="64" y="551" class="c">}</text>
  <line x1="64" x2="486" y1="572" y2="572" stroke="#062b8a"/>
  <text x="64" y="594" class="lk">TYPES</text>
  <text x="160" y="594" class="lv">pii · pattern · tool · semantic</text>
  <text x="64" y="614" class="lk">STAGES</text>
  <text x="160" y="614" class="lv">input · output · tool_call</text>
  <text x="64" y="634" class="lk">ACTIONS</text>
  <text x="160" y="634" class="lv">flag · redact · rewrite · block</text>
  <text x="160" y="654" class="lv">require_approval</text>
  <text x="64" y="674" class="lk">MODES</text>
  <text x="160" y="674" class="lv">monitor · enforce, per policy or rule</text>
  <text x="560" y="56" class="k">2 · ROLL IT OUT</text>
  <rect x="560" y="74" width="570" height="146" rx="0" class="card"/>
  <circle cx="592" cy="104" r="13" class="dot"/><text x="592" y="108.5" class="n" text-anchor="middle">1</text>
  <text x="614" y="110" class="h">Replay the draft</text>
  <text x="614" y="140" class="m">POST /api/evaluate  { policy, limit }</text>
  <text x="614" y="162" class="s">Runs the draft against up to 100 recent real traces.</text>
  <text x="614" y="184" class="s">Nothing is enforced. Returns before → after for</text>
  <text x="614" y="206" class="s">each call and how often each rule fired.</text>
  <path d="M592 220 V236" class="ln" marker-end="url(#a)"/>
  <rect x="560" y="240" width="570" height="146" rx="0" class="card"/>
  <circle cx="592" cy="270" r="13" class="dot"/><text x="592" y="274.5" class="n" text-anchor="middle">2</text>
  <text x="614" y="276" class="h">Save it</text>
  <text x="614" y="306" class="m">console editor  or  PUT /api/policy</text>
  <text x="614" y="328" class="s">The policy is validated; mistakes come back as a</text>
  <text x="614" y="350" class="s">400 with details. A valid save is a new version,</text>
  <text x="614" y="372" class="s">and the gateway applies it from the next call.</text>
  <path d="M592 386 V402" class="ln" marker-end="url(#a)"/>
  <rect x="560" y="406" width="570" height="146" rx="0" class="card"/>
  <circle cx="592" cy="436" r="13" class="dot"/><text x="592" y="440.5" class="n" text-anchor="middle">3</text>
  <text x="614" y="442" class="h">Watch it in monitor mode</text>
  <text x="614" y="472" class="m">"mode": "monitor"</text>
  <text x="614" y="494" class="s">Every rule writes its events into the traces</text>
  <text x="614" y="516" class="s">with enforced: false, and nothing is changed.</text>
  <text x="614" y="538" class="s">Check what it would have done on live traffic.</text>
  <path d="M592 552 V568" class="ln" marker-end="url(#a)"/>
  <rect x="560" y="572" width="570" height="146" rx="0" class="key"/>
  <circle cx="592" cy="602" r="13" class="dot"/><text x="592" y="606.5" class="n" text-anchor="middle">4</text>
  <text x="614" y="608" class="h">Enforce</text>
  <text x="614" y="638" class="m">"mode": "enforce"</text>
  <text x="614" y="660" class="s">Save again with enforce, for the whole policy or</text>
  <text x="614" y="682" class="s">one rule at a time. Each trace records which</text>
  <text x="614" y="704" class="s">policy version ruled on it.</text>
  <path d="M510 147 H550" class="ln" marker-end="url(#a)"/>
  <path d="M1130 645.0 H1158 V313.0 H1140" class="lo" marker-end="url(#o)"/>
  <text x="1178" y="479.0" class="am" text-anchor="middle" transform="rotate(-90 1178 479.0)">roll back: save an older version again</text>
</svg>
