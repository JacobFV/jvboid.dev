<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="mg-t mg-d">
  <title id="mg-t">multigraph-nn icon</title>
  <desc id="mg-d">Two typed subgraphs — each a triangle of three nodes — linked by three parallel cross-relation edges. Left nodes are filled, right nodes are outlined, to mark the type difference.</desc>
  <rect width="256" height="256" rx="58" fill="#ece7dc"/>

  <!-- subgraph plates -->
  <rect x="32" y="56" width="92" height="144" rx="16" fill="#fbf8f0" stroke="#cfc8b4" stroke-width="3"/>
  <rect x="132" y="56" width="92" height="144" rx="16" fill="#fbf8f0" stroke="#cfc8b4" stroke-width="3"/>

  <!-- intra-graph edges, LEFT triangle: A(58,90) B(108,128) C(58,166) -->
  <g stroke="#2e7d78" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path d="M58 90 L108 128"/>
    <path d="M108 128 L58 166"/>
    <path d="M58 90 L58 166"/>
  </g>

  <!-- intra-graph edges, RIGHT triangle: D(198,90) E(148,128) F(198,166) -->
  <g stroke="#2e7d78" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path d="M198 90 L148 128"/>
    <path d="M148 128 L198 166"/>
    <path d="M198 90 L198 166"/>
  </g>

  <!-- inter-graph "multi" relation: three parallel amber bridges, each landing on real nodes -->
  <g stroke="#b07527" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M58 90 L198 90"/>
    <path d="M108 128 L148 128"/>
    <path d="M58 166 L198 166"/>
  </g>

  <!-- LEFT nodes: filled (type A) -->
  <g fill="#23251f">
    <circle cx="58" cy="90" r="10"/>
    <circle cx="108" cy="128" r="10"/>
    <circle cx="58" cy="166" r="10"/>
  </g>

  <!-- RIGHT nodes: outlined (type B) -->
  <g fill="#fbf8f0" stroke="#23251f" stroke-width="3">
    <circle cx="198" cy="90" r="10"/>
    <circle cx="148" cy="128" r="10"/>
    <circle cx="198" cy="166" r="10"/>
  </g>
</svg>
