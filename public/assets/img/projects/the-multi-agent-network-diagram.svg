<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="mt md">
  <title id="mt">The Multi-Agent Network architecture</title>
  <desc id="md">A shared salina workspace at the centre holds typed, owner-namespaced variables. Specialized agents (BERT, GPT, ViT, WaveNet, gym/dataset interfaces) read and write task-specific variables on one side. Common agents (PredAgent, SORN, SOMP) form a self-organising mesh on the other side, sharing a sparse representation language and connecting via bottom/side/top ports. A reward agent and a compute-energy estimator route credit and budget across the whole graph; each step, the executor schedules agent updates against the workspace.</desc>
  <rect width="1100" height="560" rx="26" fill="#ece7dc"/>

  <defs>
    <marker id="m-af" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1l9 5-9 5z" fill="#2e7d78"/>
    </marker>
    <marker id="m-al" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1l9 5-9 5z" fill="#b07527"/>
    </marker>
    <marker id="m-ar" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1l9 5-9 5z" fill="#c5341b"/>
    </marker>
  </defs>

  <!-- Specialized agents column (left) -->
  <rect x="32" y="60" width="244" height="440" rx="18" fill="#fbf8f0" stroke="#cfc8b4" stroke-width="1.5"/>
  <text x="52" y="92" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="600" fill="#22241f">Specialized agents</text>
  <text x="52" y="112" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-style="italic" fill="#9a917a">pretrained · labelled ports</text>
  <g font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#22241f">
    <g transform="translate(52 138)">
      <rect x="0" y="0" width="180" height="32" rx="8" fill="#e7efec" stroke="#2e7d78" stroke-width="1.4"/>
      <text x="14" y="20">bert</text>
      <text x="120" y="20" font-size="10.5" fill="#5d6058">text</text>
    </g>
    <g transform="translate(52 180)">
      <rect x="0" y="0" width="180" height="32" rx="8" fill="#e7efec" stroke="#2e7d78" stroke-width="1.4"/>
      <text x="14" y="20">gpt</text>
      <text x="120" y="20" font-size="10.5" fill="#5d6058">text</text>
    </g>
    <g transform="translate(52 222)">
      <rect x="0" y="0" width="180" height="32" rx="8" fill="#e7efec" stroke="#2e7d78" stroke-width="1.4"/>
      <text x="14" y="20">vit</text>
      <text x="120" y="20" font-size="10.5" fill="#5d6058">image</text>
    </g>
    <g transform="translate(52 264)">
      <rect x="0" y="0" width="180" height="32" rx="8" fill="#e7efec" stroke="#2e7d78" stroke-width="1.4"/>
      <text x="14" y="20">wavenet</text>
      <text x="120" y="20" font-size="10.5" fill="#5d6058">audio</text>
    </g>
    <g transform="translate(52 306)">
      <rect x="0" y="0" width="180" height="32" rx="8" fill="#e7efec" stroke="#2e7d78" stroke-width="1.4"/>
      <text x="14" y="20">triple_graph</text>
      <text x="120" y="20" font-size="10.5" fill="#5d6058">kg</text>
    </g>
    <g transform="translate(52 348)">
      <rect x="0" y="0" width="180" height="32" rx="8" fill="#e7efec" stroke="#2e7d78" stroke-width="1.4"/>
      <text x="14" y="20">webcam</text>
      <text x="120" y="20" font-size="10.5" fill="#5d6058">sensor</text>
    </g>
    <g transform="translate(52 390)">
      <rect x="0" y="0" width="180" height="32" rx="8" fill="#e7efec" stroke="#2e7d78" stroke-width="1.4"/>
      <text x="14" y="20">gym_interface</text>
      <text x="120" y="20" font-size="10.5" fill="#5d6058">env</text>
    </g>
    <g transform="translate(52 432)">
      <rect x="0" y="0" width="180" height="32" rx="8" fill="#e7efec" stroke="#2e7d78" stroke-width="1.4"/>
      <text x="14" y="20">dataset</text>
      <text x="120" y="20" font-size="10.5" fill="#5d6058">replay</text>
    </g>
  </g>

  <!-- Workspace (centre) -->
  <rect x="346" y="118" width="372" height="324" rx="20" fill="#23251f"/>
  <text x="366" y="152" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="700" fill="#ece7dc">Workspace</text>
  <text x="366" y="172" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-style="italic" fill="#a89c7e">typed · owner-namespaced · gradient-aware</text>

  <g font-family="ui-monospace,Menlo,monospace" font-size="12.5" fill="#ece7dc">
    <text x="366" y="208">bert.embedding</text>
    <text x="366" y="232">gpt.tokens</text>
    <text x="366" y="256">vit.features</text>
    <text x="366" y="280">somp0.top</text>
    <text x="366" y="304">somp1.side</text>
    <text x="366" y="328">reward.signal</text>
    <text x="366" y="352">energy.budget</text>
  </g>
  <g font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#a89c7e">
    <text x="556" y="208">tensor &lt;f32&gt;</text>
    <text x="556" y="232">tensor &lt;i32&gt;</text>
    <text x="556" y="256">tensor &lt;f32&gt;</text>
    <text x="556" y="280">sparse</text>
    <text x="556" y="304">sparse</text>
    <text x="556" y="328">scalar</text>
    <text x="556" y="352">scalar</text>
  </g>
  <text x="366" y="408" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#a89c7e">timestep t · None = no signal · 0 ≡ None for common agents</text>
  <rect x="356" y="186" width="346" height="180" rx="10" fill="none" stroke="#4a4a3a" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- Common agents column (right) -->
  <rect x="788" y="60" width="280" height="328" rx="18" fill="#e4decd" stroke="#a89c7e" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>
  <rect x="810" y="48" width="180" height="24" rx="12" fill="#23251f"/>
  <text x="824" y="64" font-family="ui-monospace,Menlo,monospace" font-size="11" font-weight="600" fill="#ece7dc">common agents · self-organise</text>

  <g font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#22241f">
    <g transform="translate(808 96)">
      <circle cx="14" cy="14" r="11" fill="#fbf8f0" stroke="#b07527" stroke-width="1.6"/>
      <text x="34" y="18">PredAgent</text>
      <text x="34" y="32" font-size="10" fill="#5d6058">bottom · side · top</text>
    </g>
    <g transform="translate(808 144)">
      <circle cx="14" cy="14" r="11" fill="#fbf8f0" stroke="#b07527" stroke-width="1.6"/>
      <text x="34" y="18">SORNAgent</text>
      <text x="34" y="32" font-size="10" fill="#5d6058">recurrent · sparse</text>
    </g>
    <g transform="translate(808 192)">
      <circle cx="14" cy="14" r="11" fill="#fbf8f0" stroke="#b07527" stroke-width="1.6"/>
      <text x="34" y="18">SOMPAgent</text>
      <text x="34" y="32" font-size="10" fill="#5d6058">self-org map</text>
    </g>
    <g transform="translate(808 240)">
      <circle cx="14" cy="14" r="11" fill="#fbf8f0" stroke="#b07527" stroke-width="1.6"/>
      <text x="34" y="18">…SOMP n</text>
      <text x="34" y="32" font-size="10" fill="#5d6058">grow · prune · split</text>
    </g>
  </g>

  <!-- mesh hint among common agents -->
  <g fill="none" stroke="#b07527" stroke-width="1.4" stroke-dasharray="1 4" stroke-linecap="round">
    <path d="M822 118c40 -8 80 16 116 38"/>
    <path d="M822 166c40 -10 100 8 116 36"/>
    <path d="M822 214c40 -10 80 6 116 36"/>
    <path d="M938 156c-10 32 -10 60 0 90"/>
  </g>

  <text x="808" y="316" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-style="italic" fill="#5d6058">share a sparse representation</text>
  <text x="808" y="334" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-style="italic" fill="#5d6058">language; reproduce, train, die</text>
  <text x="808" y="352" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-style="italic" fill="#5d6058">on the autopoeisis budget</text>

  <!-- Reward + energy lane (bottom right) -->
  <rect x="788" y="412" width="280" height="92" rx="14" fill="#fbf8f0" stroke="#cfc8b4" stroke-width="1.5"/>
  <text x="808" y="442" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600" fill="#22241f">Reward · compute energy</text>
  <text x="808" y="462" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#5d6058">RewardAgent routes credit downstream</text>
  <text x="808" y="478" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#5d6058">EnergyEstimator caps per-step compute</text>
  <text x="808" y="494" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#5d6058">only energy is mandatory each tick</text>

  <!-- Executor strip (bottom left) -->
  <rect x="32" y="514" width="686" height="34" rx="10" fill="#fbf8f0" stroke="#cfc8b4" stroke-width="1.5"/>
  <text x="52" y="536" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#22241f">
    Executor · schedules agent updates · indefinite · alternating · per-agent gates · feed-forward wrapper
  </text>

  <!-- read/write arrows between specialized agents and workspace -->
  <g fill="none" stroke="#2e7d78" stroke-width="2.4" stroke-linecap="round">
    <path d="M232 154h108" marker-end="url(#m-af)"/>
    <path d="M232 196h108" marker-end="url(#m-af)"/>
    <path d="M232 238h108" marker-end="url(#m-af)"/>
    <path d="M232 280h108" marker-end="url(#m-af)"/>
    <path d="M232 322h108" marker-end="url(#m-af)"/>
    <path d="M232 406h108" marker-end="url(#m-af)"/>
    <path d="M340 364h-108" marker-end="url(#m-af)"/>
  </g>

  <!-- read/write arrows between workspace and common agents -->
  <g fill="none" stroke="#b07527" stroke-width="2.4" stroke-linecap="round">
    <path d="M724 218h60" marker-end="url(#m-al)"/>
    <path d="M724 266h60" marker-end="url(#m-al)"/>
    <path d="M784 314h-60" marker-end="url(#m-al)"/>
  </g>

  <!-- reward + energy back into workspace -->
  <g fill="none" stroke="#c5341b" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 5">
    <path d="M788 444c-30 -8 -60 -36 -68 -72" marker-end="url(#m-ar)"/>
  </g>

  <!-- legend -->
  <g font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#5d6058">
    <circle cx="744" cy="528" r="4" fill="#2e7d78"/><text x="754" y="532">specialized r/w</text>
    <circle cx="850" cy="528" r="4" fill="#b07527"/><text x="860" y="532">common r/w</text>
    <circle cx="950" cy="528" r="4" fill="#c5341b"/><text x="960" y="532">reward · energy</text>
  </g>
</svg>
