<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="sa-t sa-d">
  <title id="sa-t">standup-ai icon</title>
  <desc id="sa-d">An AI scrum lead syncing between Notion and Linear — the two source-of-truth tiles flank a central agent that drafts standups and writes follow-up tasks back.</desc>
  <rect width="256" height="256" rx="58" fill="#ece7dc"/>

  <!-- sync orbit (the agent loops between the two apps) -->
  <g fill="none" stroke="#2e7d78" stroke-width="3.5" stroke-linecap="round">
    <!-- top arc: Notion → Linear -->
    <path d="M88 92 C 128 56, 160 56, 196 92" stroke-dasharray="0" />
    <path d="M192 90 l4 4 l4 -8" />
    <!-- bottom arc: Linear → Notion -->
    <path d="M168 178 C 128 210, 96 210, 60 178" />
    <path d="M64 180 l-4 -4 l-4 8" />
  </g>

  <!-- Notion tile (left): white rounded square + serif capital N -->
  <g transform="translate(36 96)">
    <rect width="68" height="68" rx="14" fill="#ffffff" stroke="#d9d6cc" stroke-width="1.5"/>
    <text
      x="34" y="52"
      font-family="Georgia, 'Times New Roman', 'Iowan Old Style', serif"
      font-size="50" font-weight="700"
      fill="#0f0f0f"
      text-anchor="middle">N</text>
  </g>

  <!-- Linear tile (right): violet rounded square + parallel diagonal stripes -->
  <g transform="translate(152 96)">
    <rect width="68" height="68" rx="14" fill="#5e6ad2"/>
    <g stroke="#ffffff" stroke-width="4.4" stroke-linecap="round">
      <line x1="14" y1="44" x2="44" y2="14"/>
      <line x1="14" y1="54" x2="54" y2="14"/>
      <line x1="20" y1="58" x2="58" y2="20"/>
      <line x1="30" y1="58" x2="58" y2="30"/>
      <line x1="42" y1="58" x2="58" y2="42"/>
    </g>
  </g>

  <!-- Central AI agent: a small chat bubble with a spark -->
  <g transform="translate(108 28)">
    <rect width="40" height="32" rx="9" fill="#23251f"/>
    <polygon points="14,32 20,42 26,32" fill="#23251f"/>
    <!-- spark / asterisk -->
    <g stroke="#ece7dc" stroke-width="2.4" stroke-linecap="round">
      <line x1="20" y1="9" x2="20" y2="23"/>
      <line x1="13" y1="16" x2="27" y2="16"/>
      <line x1="15" y1="11" x2="25" y2="21"/>
      <line x1="25" y1="11" x2="15" y2="21"/>
    </g>
  </g>

  <!-- Bottom standup transcript line — three short "person · status" bars -->
  <g transform="translate(58 208)">
    <g fill="#b07527">
      <rect x="0" y="0" width="42" height="8" rx="4"/>
      <rect x="50" y="0" width="42" height="8" rx="4"/>
      <rect x="100" y="0" width="42" height="8" rx="4"/>
    </g>
  </g>
</svg>
