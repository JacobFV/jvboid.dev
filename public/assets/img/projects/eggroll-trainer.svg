<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">eggroll-trainer icon</title>
  <desc id="desc">A low-rank decomposition: two small rank-2 matrices forming a full-rank product grid.</desc>
  <defs>
    <linearGradient id="yolkA" x1="100" y1="180" x2="160" y2="412" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FCDC7A"/>
      <stop offset="1" stop-color="#F2A436"/>
    </linearGradient>
    <linearGradient id="yolkB" x1="180" y1="100" x2="412" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6B447"/>
      <stop offset="1" stop-color="#E5692A"/>
    </linearGradient>
    <linearGradient id="panel" x1="180" y1="180" x2="412" y2="412" gradientUnits="userSpaceOnUse">
      <stop stop-color="#262A33"/>
      <stop offset="1" stop-color="#1A1D24"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="#14161B"/>

  <!-- product AB^T : full-rank result -->
  <rect x="180" y="180" width="232" height="232" rx="16" fill="url(#panel)" stroke="#F7E9C8" stroke-opacity=".22" stroke-width="3"/>
  <g stroke="#F7E9C8" stroke-opacity=".16" stroke-width="3">
    <line x1="238" y1="184" x2="238" y2="408"/>
    <line x1="296" y1="184" x2="296" y2="408"/>
    <line x1="354" y1="184" x2="354" y2="408"/>
    <line x1="184" y1="238" x2="408" y2="238"/>
    <line x1="184" y1="296" x2="408" y2="296"/>
    <line x1="184" y1="354" x2="408" y2="354"/>
  </g>
  <!-- a few cells lit: the population converging on a solution -->
  <g fill="#F7E9C8" fill-opacity=".10">
    <rect x="180" y="238" width="58" height="58"/>
    <rect x="296" y="180" width="58" height="58"/>
    <rect x="354" y="296" width="58" height="58"/>
  </g>

  <!-- A : m x r  (tall, rank 2) -->
  <rect x="100" y="180" width="60" height="232" rx="16" fill="url(#yolkA)"/>
  <g stroke="#14161B" stroke-opacity=".34" stroke-width="3" stroke-linecap="round">
    <line x1="130" y1="186" x2="130" y2="406"/>
    <line x1="104" y1="238" x2="156" y2="238"/>
    <line x1="104" y1="296" x2="156" y2="296"/>
    <line x1="104" y1="354" x2="156" y2="354"/>
  </g>

  <!-- B^T : r x n  (wide, rank 2) -->
  <rect x="180" y="100" width="232" height="60" rx="16" fill="url(#yolkB)"/>
  <g stroke="#14161B" stroke-opacity=".34" stroke-width="3" stroke-linecap="round">
    <line x1="186" y1="130" x2="406" y2="130"/>
    <line x1="238" y1="104" x2="238" y2="156"/>
    <line x1="296" y1="104" x2="296" y2="156"/>
    <line x1="354" y1="104" x2="354" y2="156"/>
  </g>
</svg>
