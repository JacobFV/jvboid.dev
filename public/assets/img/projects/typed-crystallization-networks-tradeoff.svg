<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
  <title id="t">A crystallized typed program against matched CNNs, on parsing GUI screens</title>
  <desc id="d">Parsing GUI screens into exact widget trees. The crystallized typed program gets 12 of 12 held-out screens exactly right after learning from 6 screens; nine matched CNN arms (10,867 to 153,859 parameters, up to 192 training screens) get 0 exact trees. The CNNs run 300 to 556 times faster (31 to 61 ms against 18,375 ms) and are 250 times smaller. Source: research/FINDINGS.md section 43 in typed-crystallization-networks.</desc>
  <style>
    .ink{fill:#1a1815}.dim{fill:#54585f}.acc{fill:#d8541c}.rule{stroke:#1a1815;stroke-opacity:.16}.win{fill:#d8541c;fill-opacity:.1}
    .mono{font-family:"JetBrains Mono",ui-monospace,monospace}
    @media (prefers-color-scheme: dark){.ink{fill:#f4f1eb}.dim{fill:#9097a3}.acc{fill:#ff6b35}.rule{stroke:#f4f1eb}.win{fill:#ff6b35}}
  </style>
  <text class="ink" x="0" y="24" font-size="19" font-weight="600">Exact, or fast: the same task, two answers</text>
  <text class="dim" x="0" y="48" font-size="14">Parsing GUI screens into widget trees · held-out screens of 15–20 widgets</text>

  <text class="dim" x="430" y="92" font-size="13" text-anchor="middle">crystallized typed program</text>
  <text class="dim" x="720" y="92" font-size="13" text-anchor="middle">9 matched CNNs, any budget</text>
  <line class="rule" x1="0" y1="104" x2="880" y2="104"/>

  <!-- row 1 -->
  <rect class="win" x="300" y="110" width="260" height="58"/>
  <text class="ink" x="0" y="138" font-size="15">exact trees</text>
  <text class="dim" x="0" y="157" font-size="12">every widget and link right</text>
  <text class="acc mono" x="430" y="148" font-size="26" text-anchor="middle">12 / 12</text>
  <text class="ink mono" x="720" y="148" font-size="26" text-anchor="middle">0 / 12</text>
  <line class="rule" x1="0" y1="174" x2="880" y2="174"/>

  <!-- row 2 -->
  <rect class="win" x="300" y="180" width="260" height="58"/>
  <text class="ink" x="0" y="208" font-size="15">screens to learn from</text>
  <text class="dim" x="0" y="227" font-size="12">training data</text>
  <text class="acc mono" x="430" y="218" font-size="26" text-anchor="middle">6</text>
  <text class="ink mono" x="720" y="218" font-size="26" text-anchor="middle">192</text>
  <line class="rule" x1="0" y1="244" x2="880" y2="244"/>

  <!-- row 3 -->
  <rect class="win" x="590" y="250" width="260" height="58"/>
  <text class="ink" x="0" y="278" font-size="15">time per screen</text>
  <text class="dim" x="0" y="297" font-size="12">execution</text>
  <text class="ink mono" x="430" y="288" font-size="26" text-anchor="middle">18,375 ms</text>
  <text class="acc mono" x="720" y="288" font-size="26" text-anchor="middle">31–61 ms</text>
  <line class="rule" x1="0" y1="314" x2="880" y2="314"/>

  <!-- row 4 -->
  <rect class="win" x="590" y="320" width="260" height="58"/>
  <text class="ink" x="0" y="348" font-size="15">size</text>
  <text class="dim" x="0" y="367" font-size="12">artifact</text>
  <text class="ink mono" x="430" y="358" font-size="26" text-anchor="middle">250×</text>
  <text class="acc mono" x="720" y="358" font-size="26" text-anchor="middle">1×</text>
  <line class="rule" x1="0" y1="384" x2="880" y2="384"/>
</svg>
