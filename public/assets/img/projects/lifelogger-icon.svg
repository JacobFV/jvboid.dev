<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="ll-t ll-d">
  <title id="ll-t">lifelogger icon</title>
  <desc id="ll-d">A day's worth of small signals — git, browser, calendar, terminal — stacked as a timeline that condenses into a single summary bar.</desc>
  <rect width="256" height="256" rx="58" fill="#ece7dc"/>

  <!-- card -->
  <rect x="44" y="44" width="168" height="168" rx="22" fill="#fbf8f0" stroke="#cfc8b4" stroke-width="4"/>

  <!-- timestamp dots in the left margin -->
  <g fill="#9a917a">
    <circle cx="68" cy="80" r="4"/>
    <circle cx="68" cy="108" r="4"/>
    <circle cx="68" cy="136" r="4"/>
    <circle cx="68" cy="164" r="4"/>
  </g>

  <!-- log entries: varied widths, sparse-by-default feel -->
  <g fill="#2e7d78">
    <rect x="84" y="73" width="96" height="14" rx="4"/>
    <rect x="84" y="101" width="58" height="14" rx="4" opacity="0.85"/>
    <rect x="84" y="129" width="112" height="14" rx="4"/>
    <rect x="84" y="157" width="40" height="14" rx="4" opacity="0.7"/>
  </g>

  <!-- a small "spark" event on one row -->
  <circle cx="160" cy="108" r="5" fill="#c5341b"/>

  <!-- divider before the summary -->
  <line x1="68" y1="184" x2="188" y2="184" stroke="#cfc8b4" stroke-width="2" stroke-dasharray="2 4"/>

  <!-- condensed summary bar -->
  <rect x="68" y="191" width="120" height="10" rx="5" fill="#b07527"/>
</svg>
